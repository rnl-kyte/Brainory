<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Brainory - Notes & Drawing</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #eef2f5;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .phone {
    width: 390px; height: 844px;
    background: #F5E642;
    display: flex; flex-direction: column;
    border-radius: 44px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    overflow: hidden; position: relative;
  }
  /* DRAWER */
  .drawer-overlay {
    position: absolute; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.4);
    display: none; border-radius: 44px;
  }
  .drawer-overlay.open { display: block; }
  .drawer {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 280px; background: #fff;
    border-radius: 0 24px 24px 0;
    padding: 48px 0 32px;
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    display: flex; flex-direction: column;
    box-shadow: 4px 0 20px rgba(0,0,0,0.1);
    z-index: 101;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-header {
    padding: 0 20px 24px;
    border-bottom: 1px solid #f0f0f0;
    display: flex; align-items: center; gap: 12px;
  }
  .drawer-avatar {
    width: 48px; height: 48px; border-radius: 28px;
    background: linear-gradient(135deg, #6B8CFF, #A8C8E8);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #fff;
  }
  .drawer-user-info { display: flex; flex-direction: column; }
  .drawer-username { font-size: 15px; font-weight: 700; color: #1e293b; }
  .drawer-email { font-size: 12px; color: #64748b; }
  .drawer-nav { flex: 1; padding: 16px 0; }
  .drawer-item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px; cursor: pointer;
    font-size: 14px; color: #334155; font-weight: 500;
    text-decoration: none; transition: all 0.2s;
  }
  .drawer-item:hover { background: #f1f5f9; color: #3b82f6; }
  .drawer-item .item-icon { font-size: 18px; width: 28px; text-align: center; }
  .drawer-logout {
    margin: 16px 20px;
    background: #fee2e2; border: none; border-radius: 40px;
    padding: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 14px; font-weight: 600; color: #dc2626;
    transition: 0.2s;
  }

  /* top bar */
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 20px 8px;
  }
  .back-btn {
    background: rgba(0,0,0,0.08); border: none;
    width: 40px; height: 40px; border-radius: 50%;
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #1a1a2e;
  }
  .save-btn {
    background: #1a1a1a; color: #F5E642;
    border: none; border-radius: 30px;
    padding: 8px 20px; font-size: 13px;
    font-weight: 800; cursor: pointer; letter-spacing: 1px;
  }
  .subject-label {
    text-align: center; font-size: 12px;
    font-weight: 600; color: #555;
    letter-spacing: 2px; padding: 0 20px 8px;
    text-transform: uppercase;
  }
  /* tabs */
  .tabs {
    display: flex; border-bottom: 2px solid rgba(0,0,0,0.1);
    padding: 0 20px;
  }
  .tab {
    padding: 10px 16px; font-size: 14px;
    font-weight: 600; color: #888;
    cursor: pointer; border-bottom: 3px solid transparent;
    margin-bottom: -2px;
  }
  .tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }
  /* panels */
  .panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .panel.active { display: flex; }
  /* notes panel */
  .title-input, .subtitle-input {
    border: none; background: none;
    font-size: 16px;
    font-weight: 600;
    color: #1a1a1a;
    padding: 12px 20px 6px;
    outline: none;
    width: 100%;
  }
  .subtitle-input {
    font-size: 14px;
    font-weight: 500;
    color: #555;
    padding-top: 0;
  }
  .title-input::placeholder, .subtitle-input::placeholder {
    color: rgba(0,0,0,0.3);
  }
  .note-textarea {
    flex: 1; border: none; background: none;
    font-size: 14px; color: #444; line-height: 1.7;
    padding: 12px 20px; resize: none; outline: none;
    font-family: inherit;
  }
  /* drawing panel */
  .drawing-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px;
    overflow: hidden;
  }
  .canvas-wrapper {
    background: white;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .drawing-canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    touch-action: none;
  }
  /* bottom toolbars */
  .bottom-toolbar {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(12px);
    padding: 10px 20px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(0,0,0,0.08);
  }
  .toolbar-btn, .draw-tool-btn {
    background: #f0f2f5;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 30px;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1a1a2e;
    transition: all 0.2s;
  }
  .toolbar-btn:active, .draw-tool-btn:active {
    background: #e0e2e5;
    transform: scale(0.95);
  }
  .toolbar-text-btn {
    background: #f0f2f5;
    border: none;
    border-radius: 30px;
    padding: 10px 20px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    color: #1a1a2e;
  }
  .drawing-tools {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .brush-slider {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f0f2f5;
    padding: 8px 14px;
    border-radius: 40px;
  }
  .brush-slider label { font-size: 14px; color: #333; }
  input[type="range"] { width: 100px; }
  input[type="color"] {
    width: 44px;
    height: 44px;
    border-radius: 30px;
    border: none;
    background: #f0f2f5;
    cursor: pointer;
    padding: 0;
  }
  .save-status {
    font-size: 12px; color: #666;
    text-align: center; padding: 4px 20px;
    min-height: 20px;
  }
  /* recording modal */
  .recording-modal {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 200;
    display: none; align-items: center; justify-content: center;
  }
  .recording-modal.open { display: flex; }
  .recording-card {
    background: white; width: 280px; border-radius: 28px;
    padding: 24px; text-align: center;
  }
  .recording-card button {
    margin: 8px; padding: 8px 20px; border-radius: 40px; border: none;
    font-weight: 600; background: #f0f2f5;
  }
  .timer { font-size: 24px; font-family: monospace; margin: 12px 0; }

  /* bottom navigation */
  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(0,0,0,0.05);
    border-radius: 0 0 44px 44px;
    display: flex; align-items: center; justify-content: space-around;
    padding: 8px 12px 20px; z-index: 10;
  }
  .nav-btn {
    background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    padding: 6px 12px; border-radius: 40px;
    color: #94a3b8; font-size: 22px;
    transition: all 0.2s;
    text-decoration: none;
  }
  .nav-btn.active { color: #3b82f6; }
  .nav-btn span { font-size: 10px; font-weight: 600; }
  .nav-center-btn {
    width: 52px; height: 52px; border-radius: 52px;
    background: #3b82f6; border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; cursor: pointer;
    box-shadow: 0 6px 12px rgba(59,130,246,0.3);
    color: white; text-decoration: none;
    transition: transform 0.2s;
  }
  .nav-center-btn:active { transform: scale(0.95); }
</style>
</head>
<body>
<div class="phone">
  <!-- Drawer -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()">
    <div class="drawer" id="drawer" onclick="event.stopPropagation()">
      <div class="drawer-header">
        <div class="drawer-avatar" id="drawerAvatar">U</div>
        <div class="drawer-user-info">
          <span class="drawer-username" id="drawerUsername">User</span>
          <span class="drawer-email" id="drawerEmail">user@gmail.com</span>
        </div>
      </div>
      <nav class="drawer-nav">
        <a class="drawer-item" href="dashboard.html"><i class="fas fa-home item-icon"></i> Home</a>
        <a class="drawer-item" href="profile.html"><i class="fas fa-user item-icon"></i> Profile</a>
        <a class="drawer-item" href="notification.html"><i class="fas fa-bell item-icon"></i> Notifications</a>
        <a class="drawer-item" href="progress.html"><i class="fas fa-chart-line item-icon"></i> Progress</a>
        <a class="drawer-item" href="notes.html"><i class="fas fa-pen-alt item-icon"></i> Notes</a>
        <a class="drawer-item" href="quiz.html"><i class="fas fa-brain item-icon"></i> Quizzes</a>
        <a class="drawer-item" href="archive.html"><i class="fas fa-archive item-icon"></i> Archive</a>
        <a class="drawer-item" href="settings.html"><i class="fas fa-cog item-icon"></i> Settings</a>
        <a class="drawer-item" href="about.html"><i class="fas fa-info-circle item-icon"></i> About</a>
      </nav>
      <button class="drawer-logout" onclick="window.location.href='logout.html'"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </div>

  <div class="top-bar">
    <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
    <button class="save-btn" onclick="saveNote()">SAVE</button>
  </div>
  <div class="subject-label">Create Lesson Note</div>
  <div class="tabs">
    <div class="tab active" id="tabNotes" onclick="switchTab('notes')"><i class="fas fa-pen-alt"></i> Notes</div>
    <div class="tab" id="tabDraw" onclick="switchTab('draw')"><i class="fas fa-paintbrush"></i> Drawing</div>
  </div>
  <div class="save-status" id="saveStatus"></div>

  <div class="panel active" id="panelNotes">
    <input class="title-input" id="noteTitle" type="text" placeholder="Subject Title">
    <input class="subtitle-input" id="noteSubtitle" type="text" placeholder="Topic Title">
    <textarea class="note-textarea" id="noteContent" placeholder="Write your lesson notes here..."></textarea>
    <div class="bottom-toolbar" id="notesToolbar">
      <button class="toolbar-btn" id="cameraBtn"><i class="fas fa-camera"></i></button>
      <button class="toolbar-btn" id="fileBtn"><i class="fas fa-paperclip"></i></button>
      <button class="toolbar-text-btn" id="fontBtn">Aa</button>
      <button class="toolbar-btn" id="micBtn"><i class="fas fa-microphone"></i></button>
    </div>
  </div>

  <!-- DRAWING PANEL -->
  <div class="panel" id="panelDraw">
    <div class="drawing-container">
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="drawCanvas" class="drawing-canvas"></canvas>
      </div>
    </div>
    <div class="bottom-toolbar" id="drawingToolbar">
      <div class="drawing-tools">
        <button class="draw-tool-btn" id="penBtn" title="Pen"><i class="fas fa-pen-fancy"></i></button>
        <button class="draw-tool-btn" id="eraserBtn" title="Eraser"><i class="fas fa-eraser"></i></button>
        <input type="color" id="colorPicker" value="#000000">
        <div class="brush-slider">
          <i class="fas fa-paintbrush"></i>
          <input type="range" id="brushSize" min="1" max="30" value="3">
        </div>
        <button class="draw-tool-btn" id="clearCanvasBtn" title="Clear"><i class="fas fa-trash-alt"></i></button>
        <button class="draw-tool-btn" id="saveDrawBtn" title="Save"><i class="fas fa-save"></i></button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <a class="nav-btn" href="dashboard.html"><i class="fas fa-home"></i><span>Home</span></a>
    <a class="nav-btn" href="subject.html"><i class="fas fa-book"></i><span>Lessons</span></a>
    <a class="nav-center-btn" href="notes.html"><i class="fas fa-plus"></i></a>
    <a class="nav-btn" href="progress.html"><i class="fas fa-chart-line"></i><span>Graphs</span></a>
    <a class="nav-btn" href="schedule.html"><i class="fas fa-calendar-alt"></i><span>Calendar</span></a>
  </div>
</div>

<!-- hidden inputs -->
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
<input type="file" id="fileInput" style="display:none">

<!-- recording modal -->
<div class="recording-modal" id="recordingModal">
  <div class="recording-card">
    <h3><i class="fas fa-microphone"></i> Recording</h3>
    <div class="timer" id="recTimer">00:00</div>
    <button id="startRecordBtn">Start</button>
    <button id="stopRecordBtn" disabled>Stop</button>
    <button onclick="closeRecordingModal()">Cancel</button>
  </div>
</div>

<script>
  const email = localStorage.getItem('brainory_currentUser');
  if (!email) window.location.href = 'login.html';
  const key = 'brainory_' + email;
  let data = JSON.parse(localStorage.getItem(key) || '{}');
  if (!data.notes) data.notes = [];
  if (!data.drawings) data.drawings = [];

  let mediaRecorder;
  let audioChunks = [];
  let recordingTimer;
  let seconds = 0;

  // ---------- Tab switching ----------
  function switchTab(tab) {
    const notesTab = document.getElementById('tabNotes');
    const drawTab = document.getElementById('tabDraw');
    const notesPanel = document.getElementById('panelNotes');
    const drawPanel = document.getElementById('panelDraw');
    if (tab === 'notes') {
      notesTab.classList.add('active');
      drawTab.classList.remove('active');
      notesPanel.classList.add('active');
      drawPanel.classList.remove('active');
    } else {
      drawTab.classList.add('active');
      notesTab.classList.remove('active');
      drawPanel.classList.add('active');
      notesPanel.classList.remove('active');
      setTimeout(() => initCanvas(), 100);
    }
  }

  function saveNote() {
    const subject = document.getElementById('noteTitle').value.trim();
    const topic = document.getElementById('noteSubtitle').value.trim();
    const content = document.getElementById('noteContent').value.trim();
    if (!subject && !topic && !content) {
      showStatus('Nothing to save.');
      return;
    }
    if (!subject) {
      showStatus('Please enter a subject (Title).');
      return;
    }
    const newNote = {
      id: Date.now(),
      subject: subject,
      topic: topic || 'General',
      content: content,
      date: new Date().toLocaleString(),
      type: 'text'
    };
    data.notes.unshift(newNote);
    localStorage.setItem(key, JSON.stringify(data));
    document.getElementById('noteTitle').value = '';
    document.getElementById('noteSubtitle').value = '';
    document.getElementById('noteContent').value = '';
    showStatus('Note saved to Lessons!');
    if (navigator.vibrate) navigator.vibrate(50);
  }

  function showStatus(msg) { 
    const el = document.getElementById('saveStatus'); 
    el.textContent = msg; 
    setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 2000); 
  }

  let canvas, ctx, drawing = false;
  let currentTool = 'pen';
  let currentColor = '#000000';
  let currentWidth = 3;

  function initCanvas() {
    canvas = document.getElementById('drawCanvas');
    if (!canvas) return;
    const wrapper = document.getElementById('canvasWrapper');
    const width = wrapper.clientWidth;
    const height = wrapper.clientHeight;
    canvas.width = width;
    canvas.height = height;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx = canvas.getContext('2d');
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = currentWidth;
    ctx.lineCap = 'round';
    drawing = false;
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      let clientX, clientY;
      if (e.touches) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
      else { clientX = e.clientX; clientY = e.clientY; }
      let x = (clientX - rect.left) * scaleX;
      let y = (clientY - rect.top) * scaleY;
      x = Math.min(Math.max(x, 0), canvas.width);
      y = Math.min(Math.max(y, 0), canvas.height);
      return { x, y };
    }
    function startDraw(e) { drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
    function draw(e) { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
    function stopDraw() { drawing = false; }
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDraw);
    updateDrawingContext();
  }

  function updateDrawingContext() {
    if (!ctx) return;
    if (currentTool === 'eraser') ctx.strokeStyle = 'white';
    else ctx.strokeStyle = currentColor;
    ctx.lineWidth = currentWidth;
  }

  function setPen() {
    currentTool = 'pen';
    document.getElementById('penBtn').classList.add('active');
    document.getElementById('eraserBtn').classList.remove('active');
    updateDrawingContext();
  }
  function setEraser() {
    currentTool = 'eraser';
    document.getElementById('eraserBtn').classList.add('active');
    document.getElementById('penBtn').classList.remove('active');
    updateDrawingContext();
  }
  function changeColor(color) { currentColor = color; if (currentTool === 'pen') updateDrawingContext(); }
  function changeWidth(width) { currentWidth = width; updateDrawingContext(); }
  function clearCanvas() {
    if (ctx) {
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = currentTool === 'pen' ? currentColor : 'white';
    }
  }
  function saveDrawing() {
    const imgData = canvas.toDataURL();
    data.drawings.unshift(imgData);
    if (data.drawings.length > 10) data.drawings = data.drawings.slice(0, 10);
    localStorage.setItem(key, JSON.stringify(data));
    showStatus('Drawing saved!');
  }

  window.addEventListener('resize', () => {
    if (document.getElementById('panelDraw').classList.contains('active')) initCanvas();
  });

  document.getElementById('cameraBtn').onclick = () => {
    const input = document.getElementById('cameraInput');
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          data.notes.unshift({
            id: Date.now(),
            subject: document.getElementById('noteTitle').value.trim() || 'Photo',
            topic: document.getElementById('noteSubtitle').value.trim() || 'Image',
            content: '',
            imageData: ev.target.result,
            date: new Date().toLocaleString(),
            type: 'image'
          });
          localStorage.setItem(key, JSON.stringify(data));
          showStatus('Photo saved to Lessons!');
          document.getElementById('noteTitle').value = '';
          document.getElementById('noteSubtitle').value = '';
          document.getElementById('noteContent').value = '';
        };
        reader.readAsDataURL(file);
      }
      input.value = '';
    };
    input.click();
  };

  document.getElementById('fileBtn').onclick = () => {
    const input = document.getElementById('fileInput');
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          data.notes.unshift({
            id: Date.now(),
            subject: document.getElementById('noteTitle').value.trim() || 'File',
            topic: document.getElementById('noteSubtitle').value.trim() || 'Attachment',
            content: '',
            fileLink: ev.target.result,
            fileName: file.name,
            date: new Date().toLocaleString(),
            type: 'file'
          });
          localStorage.setItem(key, JSON.stringify(data));
          showStatus('File saved to Lessons!');
          document.getElementById('noteTitle').value = '';
          document.getElementById('noteSubtitle').value = '';
          document.getElementById('noteContent').value = '';
        };
        reader.readAsDataURL(file);
      }
      input.value = '';
    };
    input.click();
  };

  let fontIndex = 0;
  const fonts = ["'Inter', system-ui", "'Georgia', serif", "'Courier New', monospace"];
  document.getElementById('fontBtn').onclick = () => {
    fontIndex = (fontIndex + 1) % fonts.length;
    document.getElementById('noteContent').style.fontFamily = fonts[fontIndex];
    showStatus(`Font: ${fonts[fontIndex]}`);
  };

  let mediaStream = null;
  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaStream = stream;
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
        const audioURL = URL.createObjectURL(audioBlob);
        data.notes.unshift({
          id: Date.now(),
          subject: document.getElementById('noteTitle').value.trim() || 'Recording',
          topic: document.getElementById('noteSubtitle').value.trim() || 'Audio',
          content: '',
          audioURL: audioURL,
          date: new Date().toLocaleString(),
          type: 'audio'
        });
        localStorage.setItem(key, JSON.stringify(data));
        showStatus('Recording saved to Lessons!');
        document.getElementById('noteTitle').value = '';
        document.getElementById('noteSubtitle').value = '';
        document.getElementById('noteContent').value = '';
        if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
      };
      mediaRecorder.start();
      seconds = 0;
      updateTimerDisplay();
      recordingTimer = setInterval(() => { seconds++; updateTimerDisplay(); }, 1000);
      document.getElementById('startRecordBtn').disabled = true;
      document.getElementById('stopRecordBtn').disabled = false;
    } catch (err) {
      alert('Microphone access denied.');
      closeRecordingModal();
    }
  }
  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      clearInterval(recordingTimer);
      document.getElementById('startRecordBtn').disabled = false;
      document.getElementById('stopRecordBtn').disabled = true;
      closeRecordingModal();
    }
  }
  function updateTimerDisplay() {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    document.getElementById('recTimer').innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
  }
  function openRecordingModal() { document.getElementById('recordingModal').classList.add('open'); }
  function closeRecordingModal() {
    document.getElementById('recordingModal').classList.remove('open');
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      clearInterval(recordingTimer);
      if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
    }
    document.getElementById('startRecordBtn').disabled = false;
    document.getElementById('stopRecordBtn').disabled = true;
  }
  document.getElementById('micBtn').onclick = openRecordingModal;
  document.getElementById('startRecordBtn').onclick = startRecording;
  document.getElementById('stopRecordBtn').onclick = stopRecording;

  // ---------- Drawing toolbar events ----------
  document.getElementById('penBtn').onclick = setPen;
  document.getElementById('eraserBtn').onclick = setEraser;
  document.getElementById('colorPicker').addEventListener('input', (e) => changeColor(e.target.value));
  document.getElementById('brushSize').addEventListener('input', (e) => changeWidth(parseInt(e.target.value)));
  document.getElementById('clearCanvasBtn').onclick = clearCanvas;
  document.getElementById('saveDrawBtn').onclick = saveDrawing;

  // ---------- Drawer & user info ----------
  const users = JSON.parse(localStorage.getItem('brainory_users') || '{}');
  const user = users[email] || { username: email.split('@')[0], email };
  const initial = (user.username || email).charAt(0).toUpperCase();
  document.getElementById('drawerAvatar').innerHTML = initial;
  document.getElementById('drawerUsername').innerHTML = user.username || email.split('@')[0];
  document.getElementById('drawerEmail').innerHTML = email;

  function openDrawer() {
    document.getElementById('drawerOverlay').classList.add('open');
    document.getElementById('drawer').classList.add('open');
  }
  function closeDrawer() {
    document.getElementById('drawerOverlay').classList.remove('open');
    document.getElementById('drawer').classList.remove('open');
  }
  window.openDrawer = openDrawer;
  window.closeDrawer = closeDrawer;

  setPen();
  window.switchTab = switchTab;
  window.saveNote = saveNote;
  window.clearCanvas = clearCanvas;
  window.saveDrawing = saveDrawing;
</script>
</body>
</html>
