<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Brainory - Progress</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #eef2f5;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .phone {
    width: 390px; height: 844px;
    background: #f8fafc;
    display: flex;
    flex-direction: column;
    border-radius: 44px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    overflow: hidden;
    position: relative;
  }
  /* HEADER */
  .header-gradient {
    background: linear-gradient(160deg, #A8C8F0 0%, #B8D8C8 50%, #D4E8A0 100%);
    padding: 24px 20px 35px;
    position: relative;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .page-title {
    font-size: 22px;
    font-weight: 800;
    color: #1a1a2e;
    font-style: italic;
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  .notif-btn {
    background: rgba(255,255,255,0.6);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    color: #1a1a2e;
  }
  .profile-pic {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B6B5B, #C49880);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    overflow: hidden;
    background-size: cover;
    background-position: center;
  }
  .profile-pic img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* Search row */
  .search-row {
    margin-top: 8px;
  }
  .search-wrapper {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.5);
    border-radius: 40px;
    padding: 4px;
    backdrop-filter: blur(4px);
    width: fit-content;
  }
  .search-icon-btn {
    background: white;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    color: #3b82f6;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .search-input-container {
    display: flex;
    align-items: center;
    background: white;
    border-radius: 40px;
    overflow: hidden;
  }
  .search-input-container input {
    border: none;
    padding: 8px 12px;
    font-size: 14px;
    width: 180px;
    outline: none;
  }
  .search-close-btn {
    background: none;
    border: none;
    padding: 0 12px;
    cursor: pointer;
    color: #94a3b8;
  }
  /* Profile dropdown */
  .profile-dropdown {
    position: absolute;
    top: 50px;
    right: 0;
    width: 240px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    z-index: 1000;
    display: none;
    overflow: hidden;
  }
  .profile-dropdown.open { display: block; }
  .dropdown-user {
    padding: 16px;
    text-align: center;
    border-bottom: 1px solid #e2e8f0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .dropdown-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B6B5B, #C49880);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: white;
    overflow: hidden;
  }
  .dropdown-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .dropdown-name {
    font-size: 16px;
    font-weight: 700;
    color: #0f172a;
  }
  .dropdown-email {
    font-size: 12px;
    color: #64748b;
    margin-top: 2px;
  }
  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    font-size: 14px;
    color: #1e293b;
    cursor: pointer;
    text-decoration: none;
  }
  .dropdown-item:hover { background: #f1f5f9; }
  .dropdown-item i { width: 20px; color: #3b82f6; }
  .dropdown-divider { height: 1px; background: #e2e8f0; margin: 4px 0; }
  .dropdown-logout { color: #dc2626; }
  .dropdown-logout i { color: #dc2626; }
  /* SCROLLABLE CONTENT */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 85px;
    margin-top: -30px;
    position: relative;
    z-index: 2;
  }
  .content::-webkit-scrollbar { display: none; }
  /* CARDS */
  .card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 16px 20px;
    margin-bottom: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .card-title {
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    color: #1a1a2e;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chart-wrap { height: 130px; position: relative; }
  .chart-labels {
    display: flex;
    justify-content: space-between;
    padding: 8px 4px 0;
  }
  .chart-labels span { font-size: 11px; color: #64748b; }
  .activity-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #f1f5f9;
  }
  .activity-item:last-child { border-bottom: none; }
  .activity-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3b82f6;
    flex-shrink: 0;
  }
  .activity-info { flex: 1; }
  .activity-subj { font-size: 14px; font-weight: 600; color: #0f172a; }
  .activity-time-label { font-size: 11px; color: #64748b; }
  .activity-dur { font-size: 13px; color: #3b82f6; font-weight: 600; }
  .empty-message {
    text-align: center;
    padding: 40px;
    color: #94a3b8;
    font-size: 14px;
  }
  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-width: 390px;
    margin: 0 auto;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(0,0,0,0.05);
    border-radius: 0 0 44px 44px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 8px 12px 20px;
    z-index: 20;
  }
  .nav-btn {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border-radius: 40px;
    color: #94a3b8;
    font-size: 22px;
    text-decoration: none;
  }
  .nav-btn.active { color: #3b82f6; }
  .nav-btn span { font-size: 10px; font-weight: 600; }
  .nav-center-btn {
    width: 52px;
    height: 52px;
    border-radius: 52px;
    background: #3b82f6;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 6px 12px rgba(59,130,246,0.3);
    color: white;
    text-decoration: none;
  }
  .nav-center-btn:active { transform: scale(0.95); }
</style>
</head>
<body>
<div class="phone">
  <div class="header-gradient">
    <div class="top-bar">
      <div class="page-title">Your Progress</div>
      <div class="header-right">
        <button class="notif-btn" onclick="window.location.href='notification.html'"><i class="fas fa-bell"></i></button>
        <div class="profile-pic" id="profilePic" onclick="toggleDropdown()"></div>
        <div class="profile-dropdown" id="profileDropdown">
          <div class="dropdown-user" id="dropdownUserInfo">
            <div class="dropdown-avatar" id="dropdownAvatar"></div>
            <div class="dropdown-name" id="dropdownName">User</div>
            <div class="dropdown-email" id="dropdownEmail">user@example.com</div>
          </div>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" href="quiz.html"><i class="fas fa-brain"></i> Quiz</a>
          <a class="dropdown-item" href="archive.html"><i class="fas fa-archive"></i> Archive</a>
          <a class="dropdown-item" href="settings.html"><i class="fas fa-cog"></i> Settings</a>
          <a class="dropdown-item" href="about.html"><i class="fas fa-info-circle"></i> About</a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item dropdown-logout" href="logout.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
      </div>
    </div>
    <div class="search-row">
      <div class="search-wrapper">
        <button class="search-icon-btn" id="searchIconBtn"><i class="fas fa-search"></i></button>
        <div class="search-input-container" id="searchInputContainer" style="display: none;">
          <input type="text" id="inlineSearchInput" placeholder="Search subjects...">
          <button class="search-close-btn" id="searchCloseBtn"><i class="fas fa-times"></i></button>
        </div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="card">
      <div class="card-title"><i class="fas fa-chart-line"></i> Study Trend</div>
      <div class="chart-wrap">
        <canvas id="progressChart"></canvas>
      </div>
      <div class="chart-labels">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><i class="fas fa-history"></i> Your Activity</div>
      <div id="activityList"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <a class="nav-btn" href="dashboard.html"><i class="fas fa-home"></i><span>Home</span></a>
    <a class="nav-btn" href="subject.html"><i class="fas fa-book"></i><span>Lessons</span></a>
    <a class="nav-center-btn" href="notes.html"><i class="fas fa-plus"></i></a>
    <a class="nav-btn active" href="progress.html"><i class="fas fa-chart-line"></i><span>Graphs</span></a>
    <a class="nav-btn" href="schedule.html"><i class="fas fa-calendar-alt"></i><span>Calendar</span></a>
  </div>
</div>

<script>
  const email = localStorage.getItem('brainory_currentUser');
  if (!email) window.location.href = 'login.html';
  const users = JSON.parse(localStorage.getItem('brainory_users') || '{}');
  const user = users[email] || { username: email.split('@')[0], email };
  const storageKey = 'brainory_' + email;
  let appData = JSON.parse(localStorage.getItem(storageKey) || '{}');
  if (!appData.activities) appData.activities = [
    { date: new Date().toISOString().slice(0,10), time: '10:30 AM', subject: 'IT 321', duration: '1h 30m' },
    { date: new Date().toISOString().slice(0,10), time: '2:00 PM', subject: 'IT 327', duration: '3h 30m' },
    { date: new Date().toISOString().slice(0,10), time: '10:00 PM', subject: 'IT 505', duration: '2h 30m' },
    { date: new Date().toISOString().slice(0,10), time: '1:30 AM', subject: 'IT 321', duration: '1h 30m' }
  ];

  // Helper: set profile picture (avatar or initials)
  function setProfilePicture(element, user) {
    if (!element) return;
    if (user.avatar) {
      element.innerHTML = `<img src="${user.avatar}" alt="avatar">`;
      element.style.background = 'none';
    } else {
      const initial = (user.username || user.email).charAt(0).toUpperCase();
      element.innerHTML = initial;
      element.style.background = 'linear-gradient(135deg, #8B6B5B, #C49880)';
    }
  }

  let currentSearchQuery = "";

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
  }

  function getFilteredActivities() {
    if (!currentSearchQuery.trim()) return appData.activities;
    const q = currentSearchQuery.trim().toLowerCase();
    return appData.activities.filter(act => act.subject.toLowerCase().includes(q));
  }

  function renderActivities() {
    const container = document.getElementById('activityList');
    container.innerHTML = '';
    const filtered = getFilteredActivities();
    if (filtered.length === 0 && currentSearchQuery.trim() !== "") {
      container.innerHTML = `<div class="empty-message"><i class="fas fa-search"></i> No activities match "${escapeHtml(currentSearchQuery)}"</div>`;
      return;
    }
    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-message"><i class="fas fa-clock"></i> No activities yet. Start studying!</div>';
      return;
    }
    filtered.forEach(act => {
      const div = document.createElement('div');
      div.className = 'activity-item';
      div.innerHTML = `
        <div class="activity-dot"></div>
        <div class="activity-info">
          <div class="activity-subj">${escapeHtml(act.subject)}</div>
          <div class="activity-time-label">${escapeHtml(act.time)}</div>
        </div>
        <div class="activity-dur">${escapeHtml(act.duration)}</div>
      `;
      container.appendChild(div);
    });
  }

  // Chart
  const ctx = document.getElementById('progressChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['Mon','Tue','Wed','Thu','Fri','Sat'],
      datasets: [{
        data: [2.5, 4, 3, 5, 3.5, 4.5],
        borderColor: '#3b82f6',
        backgroundColor: 'rgba(59,130,246,0.1)',
        borderWidth: 2.5,
        fill: true,
        tension: 0.4,
        pointRadius: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { display: false }, tooltip: { enabled: true } },
      scales: { x: { display: false }, y: { display: false } }
    }
  });

  // Search
  const searchIconBtn = document.getElementById('searchIconBtn');
  const searchInputContainer = document.getElementById('searchInputContainer');
  const inlineSearchInput = document.getElementById('inlineSearchInput');
  const searchCloseBtn = document.getElementById('searchCloseBtn');
  
  function openInlineSearch() {
    searchIconBtn.style.display = 'none';
    searchInputContainer.style.display = 'flex';
    inlineSearchInput.focus();
    inlineSearchInput.value = currentSearchQuery;
  }
  function closeInlineSearch(resetQuery = true) {
    searchIconBtn.style.display = 'flex';
    searchInputContainer.style.display = 'none';
    if (resetQuery) {
      currentSearchQuery = "";
      inlineSearchInput.value = "";
      renderActivities();
    }
  }
  searchIconBtn.addEventListener('click', openInlineSearch);
  searchCloseBtn.addEventListener('click', () => closeInlineSearch(true));
  inlineSearchInput.addEventListener('input', (e) => {
    currentSearchQuery = e.target.value;
    renderActivities();
  });
  document.addEventListener('click', function(e) {
    const wrapper = document.querySelector('.search-wrapper');
    if (searchInputContainer.style.display === 'flex' && wrapper && !wrapper.contains(e.target)) {
      if (currentSearchQuery.trim() === "") closeInlineSearch(true);
    }
  });

  // Profile dropdown with avatar support
  const profilePic = document.getElementById('profilePic');
  const profileDropdown = document.getElementById('profileDropdown');
  const dropdownAvatar = document.getElementById('dropdownAvatar');
  function toggleDropdown(e) {
    e.stopPropagation();
    profileDropdown.classList.toggle('open');
  }
  profilePic.addEventListener('click', toggleDropdown);
  document.addEventListener('click', function(e) {
    if (!profilePic.contains(e.target) && !profileDropdown.contains(e.target)) {
      profileDropdown.classList.remove('open');
    }
  });
  setProfilePicture(profilePic, user);
  setProfilePicture(dropdownAvatar, user);
  document.getElementById('dropdownName').innerHTML = user.username || email.split('@')[0];
  document.getElementById('dropdownEmail').innerHTML = email;
  document.getElementById('dropdownUserInfo').onclick = () => window.location.href = 'profile.html';

  renderActivities();
</script>
</body>
</html>
