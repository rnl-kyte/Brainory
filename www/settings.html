<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Brainory - Settings</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #eef2f5;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .phone {
    width: 390px; height: 844px;
    background: #f8fafc;
    display: flex;
    flex-direction: column;
    border-radius: 44px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    overflow: hidden;
    position: relative;
  }
  /* HEADER - same as profile & archive */
  .header-gradient {
    background: linear-gradient(160deg, #A8C8F0 0%, #B8D8C8 50%, #D4E8A0 100%);
    padding: 24px 20px 35px;
    position: relative;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .back-btn {
    background: rgba(255,255,255,0.6);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    color: #1a1a2e;
    transition: 0.2s;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  .notif-btn {
    background: rgba(255,255,255,0.6);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    color: #1a1a2e;
  }
  .profile-pic {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B6B5B, #C49880);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    overflow: hidden;
    background-size: cover;
    background-position: center;
  }
  .profile-pic img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .page-title {
    font-size: 22px;
    font-weight: 800;
    color: #1a1a2e;
    font-style: italic;
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  /* Profile dropdown (same as other pages) */
  .profile-dropdown {
    position: absolute;
    top: 50px;
    right: 0;
    width: 240px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    z-index: 1000;
    display: none;
    overflow: hidden;
  }
  .profile-dropdown.open { display: block; }
  .dropdown-user {
    padding: 16px;
    text-align: center;
    border-bottom: 1px solid #e2e8f0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .dropdown-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B6B5B, #C49880);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: white;
    overflow: hidden;
  }
  .dropdown-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .dropdown-name { font-size: 16px; font-weight: 700; color: #0f172a; }
  .dropdown-email { font-size: 12px; color: #64748b; margin-top: 2px; }
  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    font-size: 14px;
    color: #1e293b;
    cursor: pointer;
    text-decoration: none;
  }
  .dropdown-item:hover { background: #f1f5f9; }
  .dropdown-item i { width: 20px; color: #3b82f6; }
  .dropdown-divider { height: 1px; background: #e2e8f0; margin: 4px 0; }
  .dropdown-logout { color: #dc2626; }
  .dropdown-logout i { color: #dc2626; }
  /* MAIN CONTENT */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 30px;
    margin-top: -30px;
    position: relative;
    z-index: 2;
  }
  .content::-webkit-scrollbar { display: none; }
  /* SETTINGS GROUPS */
  .settings-group {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .settings-header {
    padding: 14px 20px;
    background: rgba(0,0,0,0.02);
    border-bottom: 1px solid #e2e8f0;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    color: #64748b;
    letter-spacing: 0.5px;
  }
  .setting-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid #f1f5f9;
  }
  .setting-item:last-child { border-bottom: none; }
  .setting-label {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
    font-weight: 500;
    color: #0f172a;
  }
  .setting-label i { width: 24px; color: #3b82f6; font-size: 18px; }
  .switch {
    position: relative; display: inline-block; width: 48px; height: 24px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: #cbd5e1; transition: 0.3s; border-radius: 34px;
  }
  .slider:before {
    position: absolute; content: ""; height: 18px; width: 18px;
    left: 3px; bottom: 3px; background-color: white; transition: 0.3s; border-radius: 50%;
  }
  input:checked + .slider { background-color: #3b82f6; }
  input:checked + .slider:before { transform: translateX(24px); }
  .select-style {
    background: #f0f2f5; border: none; padding: 6px 12px;
    border-radius: 30px; font-size: 14px; color: #1e293b;
  }
  .danger-btn {
    background: #fee2e2; color: #dc2626; border: none;
    border-radius: 40px; padding: 12px; font-weight: 600;
    width: 100%; text-align: center; cursor: pointer; margin-top: 12px;
  }
  /* MODAL */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 300;
    display: none; align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-content {
    background: white; width: 280px; border-radius: 28px;
    padding: 24px; text-align: center;
  }
  .modal-content p { margin-bottom: 20px; color: #1e293b; }
  .modal-buttons { display: flex; gap: 12px; margin-top: 12px; }
  .modal-buttons button {
    flex: 1; padding: 10px; border-radius: 40px;
    border: none; font-weight: 600; cursor: pointer;
  }
  .btn-confirm { background: #3b82f6; color: white; }
  .btn-cancel { background: #f1f5f9; color: #334155; }
</style>
</head>
<body>
<div class="phone">
  <div class="header-gradient">
    <div class="top-bar">
      <button class="back-btn" onclick="window.location.href='dashboard.html'"><i class="fas fa-arrow-left"></i></button>
      <div class="header-right">
        <button class="notif-btn" onclick="window.location.href='notification.html'"><i class="fas fa-bell"></i></button>
        <div class="profile-pic" id="profilePic" onclick="toggleDropdown()"></div>
        <div class="profile-dropdown" id="profileDropdown">
          <div class="dropdown-user" id="dropdownUserInfo">
            <div class="dropdown-avatar" id="dropdownAvatar"></div>
            <div class="dropdown-name" id="dropdownName">User</div>
            <div class="dropdown-email" id="dropdownEmail">user@example.com</div>
          </div>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" href="quiz.html"><i class="fas fa-brain"></i> Quiz</a>
          <a class="dropdown-item" href="archive.html"><i class="fas fa-archive"></i> Archive</a>
          <a class="dropdown-item" href="settings.html"><i class="fas fa-cog"></i> Settings</a>
          <a class="dropdown-item" href="about.html"><i class="fas fa-info-circle"></i> About</a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item dropdown-logout" id="dropdownLogoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
      </div>
    </div>
    <div class="page-title">Settings</div>
  </div>

  <div class="content">
    <div class="settings-group">
      <div class="settings-header">Preferences</div>
      <div class="setting-item">
        <div class="setting-label"><i class="fas fa-bell"></i> Push Notifications</div>
        <label class="switch"><input type="checkbox" id="notifToggle" checked><span class="slider"></span></label>
      </div>
      <div class="setting-item">
        <div class="setting-label"><i class="fas fa-font"></i> Font Size</div>
        <select id="fontSizeSelect" class="select-style">
          <option value="small">Small</option><option value="medium" selected>Medium</option><option value="large">Large</option>
        </select>
      </div>
    </div>
    <div class="settings-group">
      <div class="settings-header">Data Management</div>
      <div class="setting-item">
        <div class="setting-label"><i class="fas fa-database"></i> Export Data</div>
        <button id="exportBtn" style="background:#f0f2f5; border:none; padding:6px 16px; border-radius:30px; cursor:pointer;">Export</button>
      </div>
      <div class="setting-item">
        <div class="setting-label"><i class="fas fa-trash-alt"></i> Clear All Data</div>
        <button id="clearDataBtn" style="background:#fee2e2; color:#dc2626; border:none; padding:6px 16px; border-radius:30px; cursor:pointer;">Clear</button>
      </div>
    </div>
    <div class="settings-group">
      <div class="settings-header">About</div>
      <div class="setting-item">
        <div class="setting-label"><i class="fas fa-info-circle"></i> App Version</div>
        <span style="color:#64748b;">Brainory 1.0.0</span>
      </div>
      <div class="setting-item">
        <div class="setting-label"><i class="fas fa-shield-alt"></i> Privacy Policy</div>
        <button id="privacyBtn" style="background:none; border:none; color:#3b82f6; cursor:pointer;">View</button>
      </div>
    </div>
    <button id="logoutSettingsBtn" class="danger-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>

  <!-- Modal for confirmations and info -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <p id="modalMessage">Are you sure?</p>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-confirm" id="modalConfirmBtn">Confirm</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ---------- AUTH & DATA ----------
  const email = localStorage.getItem('brainory_currentUser');
  if (!email) window.location.href = 'login.html';
  const users = JSON.parse(localStorage.getItem('brainory_users') || '{}');
  const user = users[email] || { username: email.split('@')[0], email };
  const storageKey = 'brainory_' + email;

  // Helper: set profile picture (avatar or initials)
  function setProfilePicture(element, user) {
    if (!element) return;
    if (user.avatar) {
      element.innerHTML = `<img src="${user.avatar}" alt="avatar">`;
      element.style.background = 'none';
    } else {
      const initial = (user.username || user.email).charAt(0).toUpperCase();
      element.innerHTML = initial;
      element.style.background = 'linear-gradient(135deg, #8B6B5B, #C49880)';
    }
  }

  // ---------- Settings persistence ----------
  let settings = JSON.parse(localStorage.getItem('brainory_settings') || '{}');
  const notifToggle = document.getElementById('notifToggle');
  const fontSizeSelect = document.getElementById('fontSizeSelect');
  notifToggle.checked = settings.notifications !== false;
  fontSizeSelect.value = settings.fontSize || 'medium';

  function saveSettings() {
    settings.notifications = notifToggle.checked;
    settings.fontSize = fontSizeSelect.value;
    localStorage.setItem('brainory_settings', JSON.stringify(settings));
    applyFontSize();
  }

  function applyFontSize() {
    const size = fontSizeSelect.value;
    const root = document.documentElement;
    if (size === 'small') root.style.fontSize = '13px';
    else if (size === 'medium') root.style.fontSize = '15px';
    else if (size === 'large') root.style.fontSize = '18px';
  }
  applyFontSize();

  notifToggle.addEventListener('change', saveSettings);
  fontSizeSelect.addEventListener('change', saveSettings);

  // ---------- Modal system ----------
  let pendingAction = null;
  function showModal(message, onConfirm, isInfo = false) {
    const modalMsg = document.getElementById('modalMessage');
    const confirmBtn = document.getElementById('modalConfirmBtn');
    modalMsg.innerText = message;
    if (isInfo) {
      confirmBtn.innerText = 'OK';
      confirmBtn.onclick = () => {
        closeModal();
        confirmBtn.innerText = 'Confirm';
        if (onConfirm) onConfirm();
      };
      document.getElementById('modalOverlay').classList.add('open');
      return;
    }
    confirmBtn.innerText = 'Confirm';
    pendingAction = onConfirm;
    confirmBtn.onclick = () => {
      if (pendingAction) pendingAction();
      closeModal();
      pendingAction = null;
      confirmBtn.onclick = () => {};
    };
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }
  window.closeModal = closeModal;

  // ---------- Export data ----------
  document.getElementById('exportBtn').onclick = () => {
    const allData = localStorage.getItem(storageKey);
    if (!allData) {
      showModal('No data to export.', null, true);
      return;
    }
    const blob = new Blob([allData], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `brainory_backup_${new Date().toISOString().slice(0,19)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showModal('Data exported successfully!', null, true);
  };

  // ---------- Clear all data ----------
  document.getElementById('clearDataBtn').onclick = () => {
    showModal('⚠️ Are you sure? This will delete ALL your notes, subjects, schedules, activities, and settings. This action cannot be undone.', () => {
      localStorage.removeItem(storageKey);
      localStorage.removeItem('brainory_settings');
      showModal('All data cleared. The app will restart.', () => {
        window.location.href = 'login.html';
      }, true);
    });
  };

  // ---------- Privacy policy ----------
  document.getElementById('privacyBtn').onclick = () => {
    showModal('Your data is stored locally on your device. No data is sent to any external server. You have full control over your information.', null, true);
  };

  // ---------- Logout ----------
  function logout() {
    localStorage.removeItem('brainory_currentUser');
    window.location.href = 'login.html';
  }
  document.getElementById('logoutSettingsBtn').onclick = () => showModal('Log out of Brainory?', logout);
  const dropdownLogout = document.getElementById('dropdownLogoutBtn');
  if (dropdownLogout) dropdownLogout.onclick = () => showModal('Log out of Brainory?', logout);

  // ---------- Profile dropdown ----------
  const profilePic = document.getElementById('profilePic');
  const profileDropdown = document.getElementById('profileDropdown');
  const dropdownAvatar = document.getElementById('dropdownAvatar');
  function toggleDropdown(e) {
    e.stopPropagation();
    profileDropdown.classList.toggle('open');
  }
  profilePic.addEventListener('click', toggleDropdown);
  document.addEventListener('click', function(e) {
    if (!profilePic.contains(e.target) && !profileDropdown.contains(e.target)) {
      profileDropdown.classList.remove('open');
    }
  });
  setProfilePicture(profilePic, user);
  setProfilePicture(dropdownAvatar, user);
  document.getElementById('dropdownName').innerHTML = user.username || email.split('@')[0];
  document.getElementById('dropdownEmail').innerHTML = email;
  document.getElementById('dropdownUserInfo').onclick = () => window.location.href = 'profile.html';
</script>
</body>
</html>
