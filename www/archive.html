<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Brainory - Archive</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #eef2f5;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .phone {
    width: 390px; height: 844px;
    background: #f8fafc;
    display: flex;
    flex-direction: column;
    border-radius: 44px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    overflow: hidden;
    position: relative;
  }
  /* HEADER - same as profile page */
  .header-gradient {
    background: linear-gradient(160deg, #A8C8F0 0%, #B8D8C8 50%, #D4E8A0 100%);
    padding: 24px 20px 35px;
    position: relative;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .back-btn {
    background: rgba(255,255,255,0.6);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    color: #1a1a2e;
    transition: 0.2s;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  .notif-btn {
    background: rgba(255,255,255,0.6);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    color: #1a1a2e;
  }
  .profile-pic {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B6B5B, #C49880);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    overflow: hidden;
    background-size: cover;
    background-position: center;
  }
  .profile-pic img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .page-title {
    font-size: 22px;
    font-weight: 800;
    color: #1a1a2e;
    font-style: italic;
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  /* Profile dropdown (same as other pages) */
  .profile-dropdown {
    position: absolute;
    top: 50px;
    right: 0;
    width: 240px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    z-index: 1000;
    display: none;
    overflow: hidden;
  }
  .profile-dropdown.open { display: block; }
  .dropdown-user {
    padding: 16px;
    text-align: center;
    border-bottom: 1px solid #e2e8f0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .dropdown-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B6B5B, #C49880);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: white;
    overflow: hidden;
  }
  .dropdown-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .dropdown-name { font-size: 16px; font-weight: 700; color: #0f172a; }
  .dropdown-email { font-size: 12px; color: #64748b; margin-top: 2px; }
  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    font-size: 14px;
    color: #1e293b;
    cursor: pointer;
    text-decoration: none;
  }
  .dropdown-item:hover { background: #f1f5f9; }
  .dropdown-item i { width: 20px; color: #3b82f6; }
  .dropdown-divider { height: 1px; background: #e2e8f0; margin: 4px 0; }
  .dropdown-logout { color: #dc2626; }
  .dropdown-logout i { color: #dc2626; }
  /* MAIN CONTENT */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 30px;
    margin-top: -30px;
    position: relative;
    z-index: 2;
  }
  .content::-webkit-scrollbar { display: none; }
  /* ARCHIVE CARDS */
  .archive-card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .archive-info { flex: 1; }
  .archive-title { font-size: 15px; font-weight: 700; color: #0f172a; }
  .archive-date { font-size: 11px; color: #64748b; margin-top: 4px; }
  .restore-btn {
    background: none; border: none; font-size: 20px; cursor: pointer;
    color: #3b82f6; padding: 8px;
  }
  .empty-archive {
    text-align: center; padding: 48px 20px;
    color: #94a3b8;
  }
  /* MODAL */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 300;
    display: none; align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-content {
    background: white; width: 280px; border-radius: 28px;
    padding: 24px; text-align: center;
  }
  .modal-content p { margin-bottom: 20px; color: #1e293b; }
  .modal-buttons { display: flex; gap: 12px; }
  .modal-buttons button {
    flex: 1; padding: 10px; border-radius: 40px;
    border: none; font-weight: 600; cursor: pointer;
  }
  .btn-confirm { background: #3b82f6; color: white; }
  .btn-cancel { background: #f1f5f9; color: #334155; }
</style>
</head>
<body>
<div class="phone">
  <div class="header-gradient">
    <div class="top-bar">
      <button class="back-btn" onclick="window.location.href='dashboard.html'"><i class="fas fa-arrow-left"></i></button>
      <div class="header-right">
        <button class="notif-btn" onclick="window.location.href='notification.html'"><i class="fas fa-bell"></i></button>
        <div class="profile-pic" id="profilePic" onclick="toggleDropdown()"></div>
        <div class="profile-dropdown" id="profileDropdown">
          <div class="dropdown-user" id="dropdownUserInfo">
            <div class="dropdown-avatar" id="dropdownAvatar"></div>
            <div class="dropdown-name" id="dropdownName">User</div>
            <div class="dropdown-email" id="dropdownEmail">user@example.com</div>
          </div>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" href="quiz.html"><i class="fas fa-brain"></i> Quiz</a>
          <a class="dropdown-item" href="archive.html"><i class="fas fa-archive"></i> Archive</a>
          <a class="dropdown-item" href="settings.html"><i class="fas fa-cog"></i> Settings</a>
          <a class="dropdown-item" href="about.html"><i class="fas fa-info-circle"></i> About</a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item dropdown-logout" href="logout.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
      </div>
    </div>
    <div class="page-title">Archive</div>
  </div>

  <div class="content" id="archiveContent"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <p id="modalMessage">Restore this subject and all its lessons?</p>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-confirm" id="modalConfirmBtn">Confirm</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ---------- AUTH & DATA ----------
  const email = localStorage.getItem('brainory_currentUser');
  if (!email) window.location.href = 'login.html';
  const users = JSON.parse(localStorage.getItem('brainory_users') || '{}');
  const user = users[email] || { username: email.split('@')[0], email };
  const storageKey = 'brainory_' + email;
  let appData = JSON.parse(localStorage.getItem(storageKey) || '{}');
  if (!appData.archived) appData.archived = [];

  // Helper: set profile picture (avatar or initials)
  function setProfilePicture(element, user) {
    if (!element) return;
    if (user.avatar) {
      element.innerHTML = `<img src="${user.avatar}" alt="avatar">`;
      element.style.background = 'none';
    } else {
      const initial = (user.username || user.email).charAt(0).toUpperCase();
      element.innerHTML = initial;
      element.style.background = 'linear-gradient(135deg, #8B6B5B, #C49880)';
    }
  }

  let pendingRestoreIndex = null;

  function renderArchive() {
    const container = document.getElementById('archiveContent');
    if (!appData.archived || appData.archived.length === 0) {
      container.innerHTML = `<div class="empty-archive"><i class="fas fa-archive" style="font-size:48px;margin-bottom:12px;display:block;"></i>No archived items yet.</div>`;
      return;
    }
    container.innerHTML = '';
    appData.archived.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'archive-card';
      card.innerHTML = `
        <div class="archive-info">
          <div class="archive-title">${escapeHtml(item.subject)}</div>
          <div class="archive-date"><i class="far fa-calendar-alt"></i> Archived on ${item.archivedDate}</div>
          <div class="archive-date" style="font-size:10px;">${item.notes.length} lesson(s)</div>
        </div>
        <button class="restore-btn" onclick="askRestore(${idx})"><i class="fas fa-trash-restore"></i></button>
      `;
      container.appendChild(card);
    });
  }

  function askRestore(index) {
    pendingRestoreIndex = index;
    document.getElementById('modalMessage').innerText = 'Restore this subject and all its lessons?';
    document.getElementById('modalOverlay').classList.add('open');
  }

  function restoreItem() {
    if (pendingRestoreIndex !== null) {
      const archivedItem = appData.archived[pendingRestoreIndex];
      if (!appData.notes) appData.notes = [];
      archivedItem.notes.forEach(note => {
        appData.notes.push(note);
      });
      appData.archived.splice(pendingRestoreIndex, 1);
      localStorage.setItem(storageKey, JSON.stringify(appData));
      renderArchive();
      // Optional: show status (but we don't have a status bar, could add a small toast later)
      pendingRestoreIndex = null;
    }
    closeModal();
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
  }

  // ---------- Profile dropdown ----------
  const profilePic = document.getElementById('profilePic');
  const profileDropdown = document.getElementById('profileDropdown');
  const dropdownAvatar = document.getElementById('dropdownAvatar');
  function toggleDropdown(e) {
    e.stopPropagation();
    profileDropdown.classList.toggle('open');
  }
  profilePic.addEventListener('click', toggleDropdown);
  document.addEventListener('click', function(e) {
    if (!profilePic.contains(e.target) && !profileDropdown.contains(e.target)) {
      profileDropdown.classList.remove('open');
    }
  });
  setProfilePicture(profilePic, user);
  setProfilePicture(dropdownAvatar, user);
  document.getElementById('dropdownName').innerHTML = user.username || email.split('@')[0];
  document.getElementById('dropdownEmail').innerHTML = email;
  document.getElementById('dropdownUserInfo').onclick = () => window.location.href = 'profile.html';

  // ---------- Modal confirm button ----------
  document.getElementById('modalConfirmBtn').onclick = restoreItem;

  // Make functions globally accessible for inline onclick
  window.askRestore = askRestore;
  window.closeModal = closeModal;

  renderArchive();
</script>
</body>
</html>
