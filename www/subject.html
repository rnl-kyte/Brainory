<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Brainory - Lessons</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #eef2f5;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .phone {
    width: 390px; height: 844px;
    background: #f8fafc;
    display: flex;
    flex-direction: column;
    border-radius: 44px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    overflow: hidden;
    position: relative;
  }
  /* HEADER */
  .header-gradient {
    background: linear-gradient(160deg, #A8C8F0 0%, #B8D8C8 50%, #D4E8A0 100%);
    padding: 24px 20px 35px;
    position: relative;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .page-title {
    font-size: 22px;
    font-weight: 800;
    color: #1a1a2e;
    font-style: italic;
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  .notif-btn {
    background: rgba(255,255,255,0.6);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    color: #1a1a2e;
    margin-top: 4px;
  }
  .profile-pic {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B6B5B, #C49880);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    overflow: hidden;
    background-size: cover;
    background-position: center;
  }
  .profile-pic img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* Search row */
  .search-row {
    margin-top: 8px;
  }
  .search-wrapper {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.5);
    border-radius: 40px;
    padding: 4px;
    backdrop-filter: blur(4px);
    width: fit-content;
  }
  .search-icon-btn {
    background: white;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    color: #3b82f6;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .search-input-container {
    display: flex;
    align-items: center;
    background: white;
    border-radius: 40px;
    overflow: hidden;
  }
  .search-input-container input {
    border: none;
    padding: 8px 12px;
    font-size: 14px;
    width: 180px;
    outline: none;
  }
  .search-close-btn {
    background: none;
    border: none;
    padding: 0 12px;
    cursor: pointer;
    color: #94a3b8;
  }
  /* Profile dropdown */
  .profile-dropdown {
    position: absolute;
    top: 50px;
    right: 0;
    width: 240px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    z-index: 1000;
    display: none;
    overflow: hidden;
  }
  .profile-dropdown.open { display: block; }
  .dropdown-user {
    padding: 16px;
    text-align: center;
    border-bottom: 1px solid #e2e8f0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .dropdown-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B6B5B, #C49880);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: white;
    overflow: hidden;
  }
  .dropdown-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .dropdown-name {
    font-size: 16px;
    font-weight: 700;
    color: #0f172a;
  }
  .dropdown-email {
    font-size: 12px;
    color: #64748b;
    margin-top: 2px;
  }
  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    font-size: 14px;
    color: #1e293b;
    cursor: pointer;
    text-decoration: none;
  }
  .dropdown-item:hover { background: #f1f5f9; }
  .dropdown-item i { width: 20px; color: #3b82f6; }
  .dropdown-divider { height: 1px; background: #e2e8f0; margin: 4px 0; }
  .dropdown-logout { color: #dc2626; }
  .dropdown-logout i { color: #dc2626; }
  /* status message */
  .save-status {
    font-size: 12px;
    color: #666;
    text-align: center;
    padding: 4px 20px;
    min-height: 20px;
    background: #f8fafc;
    position: relative;
    z-index: 2;
  }
  /* MAIN CONTENT */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 85px;
    margin-top: -30px;
    position: relative;
    z-index: 2;
  }
  .content::-webkit-scrollbar { display: none; }
  .subject-card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .subject-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .subject-header:active { background: rgba(0,0,0,0.05); }
  .subject-name {
    font-size: 18px;
    font-weight: 700;
    color: #0f172a;
  }
  .subject-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .delete-subject-btn {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: #94a3b8;
    padding: 4px;
    transition: color 0.2s;
  }
  .delete-subject-btn:hover { color: #ef4444; }
  .subject-icon {
    font-size: 20px;
    color: #64748b;
    transition: transform 0.3s;
  }
  .subject-icon.rotated { transform: rotate(180deg); }
  .topics-container {
    border-top: 1px solid #e2e8f0;
    display: none;
  }
  .topics-container.open { display: block; }
  .topic-item {
    padding: 14px 20px 14px 40px;
    cursor: pointer;
    border-bottom: 1px solid #f1f5f9;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .topic-item:last-child { border-bottom: none; }
  .topic-name {
    font-size: 15px;
    font-weight: 500;
    color: #1e293b;
  }
  .topic-arrow {
    font-size: 14px;
    color: #94a3b8;
    transition: transform 0.3s;
  }
  .topic-arrow.rotated { transform: rotate(180deg); }
  .notes-container {
    background: #f8fafc;
    padding: 0 20px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .notes-container.open {
    max-height: 500px;
    padding: 16px 20px;
  }
  .notes-text {
    font-size: 13px;
    line-height: 1.6;
    color: #334155;
    white-space: pre-wrap;
  }
  .edit-note-btn {
    background: #e2e8f0;
    border: none;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    margin-left: 12px;
  }
  .empty-message {
    text-align: center;
    padding: 40px;
    color: #94a3b8;
    font-size: 14px;
  }
  /* Modals */
  .edit-modal, .delete-modal {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 300;
    display: none; align-items: center; justify-content: center;
  }
  .edit-modal.open, .delete-modal.open { display: flex; }
  .edit-modal-content {
    background: white; width: 340px; border-radius: 28px;
    padding: 20px; max-height: 80vh; overflow-y: auto;
  }
  .edit-modal-content h3 { margin-bottom: 16px; color: #0f172a; }
  .edit-modal-content input, .edit-modal-content textarea {
    width: 100%; padding: 12px; border-radius: 40px;
    border: 1px solid #e2e8f0; margin-bottom: 12px;
    font-size: 14px;
  }
  .edit-modal-content textarea { border-radius: 20px; min-height: 150px; }
  .edit-buttons { display: flex; gap: 12px; }
  .edit-buttons button { flex: 1; padding: 10px; border-radius: 40px; border: none; font-weight: 600; cursor: pointer; }
  .save-edit { background: #3b82f6; color: white; }
  .cancel-edit { background: #f1f5f9; color: #334155; }
  .delete-modal-content {
    background: white; width: 280px; border-radius: 28px;
    padding: 24px; text-align: center;
  }
  .delete-modal-content p { margin-bottom: 20px; color: #1e293b; }
  .delete-buttons { display: flex; gap: 12px; }
  .delete-buttons button { flex: 1; padding: 10px; border-radius: 40px; border: none; font-weight: 600; cursor: pointer; }
  .delete-confirm { background: #ef4444; color: white; }
  .delete-cancel { background: #f1f5f9; color: #334155; }
  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-width: 390px;
    margin: 0 auto;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(0,0,0,0.05);
    border-radius: 0 0 44px 44px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 8px 12px 20px;
    z-index: 20;
  }
  .nav-btn {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border-radius: 40px;
    color: #94a3b8;
    font-size: 22px;
    text-decoration: none;
  }
  .nav-btn.active { color: #3b82f6; }
  .nav-btn span { font-size: 10px; font-weight: 600; }
  .nav-center-btn {
    width: 52px;
    height: 52px;
    border-radius: 52px;
    background: #3b82f6;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 6px 12px rgba(59,130,246,0.3);
    color: white;
    text-decoration: none;
  }
  .nav-center-btn:active { transform: scale(0.95); }
</style>
</head>
<body>
<div class="phone">
  <div class="header-gradient">
    <div class="top-bar">
      <div class="page-title">Lessons</div>
      <div class="header-right">
        <button class="notif-btn" onclick="window.location.href='notification.html'"><i class="fas fa-bell"></i></button>
        <div class="profile-pic" id="profilePic" onclick="toggleDropdown()"></div>
        <div class="profile-dropdown" id="profileDropdown">
          <div class="dropdown-user" id="dropdownUserInfo">
            <div class="dropdown-avatar" id="dropdownAvatar"></div>
            <div class="dropdown-name" id="dropdownName">User</div>
            <div class="dropdown-email" id="dropdownEmail">user@example.com</div>
          </div>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" href="quiz.html"><i class="fas fa-brain"></i> Quiz</a>
          <a class="dropdown-item" href="archive.html"><i class="fas fa-archive"></i> Archive</a>
          <a class="dropdown-item" href="settings.html"><i class="fas fa-cog"></i> Settings</a>
          <a class="dropdown-item" href="about.html"><i class="fas fa-info-circle"></i> About</a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item dropdown-logout" href="logout.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
      </div>
    </div>
    <div class="search-row">
      <div class="search-wrapper">
        <button class="search-icon-btn" id="searchIconBtn"><i class="fas fa-search"></i></button>
        <div class="search-input-container" id="searchInputContainer" style="display: none;">
          <input type="text" id="inlineSearchInput" placeholder="Search subject or topic...">
          <button class="search-close-btn" id="searchCloseBtn"><i class="fas fa-times"></i></button>
        </div>
      </div>
    </div>
  </div>

  <div class="save-status" id="saveStatus"></div>

  <div class="content" id="lessonsContent"></div>

  <div class="bottom-nav">
    <a class="nav-btn" href="dashboard.html"><i class="fas fa-home"></i><span>Home</span></a>
    <a class="nav-btn active" href="subject.html"><i class="fas fa-book"></i><span>Lessons</span></a>
    <a class="nav-center-btn" href="notes.html"><i class="fas fa-plus"></i></a>
    <a class="nav-btn" href="progress.html"><i class="fas fa-chart-line"></i><span>Graphs</span></a>
    <a class="nav-btn" href="schedule.html"><i class="fas fa-calendar-alt"></i><span>Calendar</span></a>
  </div>

  <div class="edit-modal" id="editModal">
    <div class="edit-modal-content">
      <h3>Edit Lesson</h3>
      <input type="text" id="editSubject" placeholder="Subject">
      <input type="text" id="editTopic" placeholder="Topic">
      <textarea id="editContent" placeholder="Content..."></textarea>
      <div class="edit-buttons">
        <button class="save-edit" id="saveEditBtn">Save</button>
        <button class="cancel-edit" id="cancelEditBtn">Cancel</button>
      </div>
    </div>
  </div>

  <div class="delete-modal" id="deleteModal">
    <div class="delete-modal-content">
      <p>Move this subject and all its lessons to Archive?</p>
      <div class="delete-buttons">
        <button class="delete-cancel" id="deleteCancelBtn">Cancel</button>
        <button class="delete-confirm" id="deleteConfirmBtn">Archive</button>
      </div>
    </div>
  </div>
</div>

<script>
  const email = localStorage.getItem('brainory_currentUser');
  if (!email) window.location.href = 'login.html';
  const users = JSON.parse(localStorage.getItem('brainory_users') || '{}');
  const user = users[email] || { username: email.split('@')[0], email };
  const storageKey = 'brainory_' + email;
  let appData = JSON.parse(localStorage.getItem(storageKey) || '{}');
  if (!appData.notes) appData.notes = [];
  if (!appData.archived) appData.archived = [];

  // Helper: set profile picture (avatar or initials)
  function setProfilePicture(element, user) {
    if (!element) return;
    if (user.avatar) {
      element.innerHTML = `<img src="${user.avatar}" alt="avatar">`;
      element.style.background = 'none';
    } else {
      const initial = (user.username || user.email).charAt(0).toUpperCase();
      element.innerHTML = initial;
      element.style.background = 'linear-gradient(135deg, #8B6B5B, #C49880)';
    }
  }

  let currentEditNoteId = null;
  let pendingDeleteSubject = null;
  let currentSearchQuery = "";

  function showStatus(msg) {
    const statusDiv = document.getElementById('saveStatus');
    statusDiv.textContent = msg;
    setTimeout(() => { if (statusDiv.textContent === msg) statusDiv.textContent = ''; }, 2000);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
  }

  function getFilteredNotes() {
    if (!currentSearchQuery.trim()) return appData.notes;
    const q = currentSearchQuery.trim().toLowerCase();
    return appData.notes.filter(note => 
      (note.subject && note.subject.toLowerCase().includes(q)) || 
      (note.topic && note.topic.toLowerCase().includes(q))
    );
  }

  function renderSubjects() {
    const container = document.getElementById('lessonsContent');
    container.innerHTML = '';
    const filteredNotes = getFilteredNotes();
    if (filteredNotes.length === 0 && currentSearchQuery.trim() !== "") {
      container.innerHTML = `<div class="empty-message"><i class="fas fa-search"></i> No lessons match "<span style="font-weight:600;">${escapeHtml(currentSearchQuery)}</span>"</div>`;
      return;
    }
    if (filteredNotes.length === 0) {
      container.innerHTML = '<div class="empty-message"><i class="fas fa-book-open"></i> No lessons yet. Go to Notes to create your first lesson note.</div>';
      return;
    }
    const grouped = {};
    filteredNotes.forEach(note => {
      if (!grouped[note.subject]) grouped[note.subject] = [];
      grouped[note.subject].push(note);
    });
    const subjects = Object.keys(grouped).sort();
    subjects.forEach(subject => {
      const notesArray = grouped[subject];
      const subjectDiv = document.createElement('div');
      subjectDiv.className = 'subject-card';
      const headerDiv = document.createElement('div');
      headerDiv.className = 'subject-header';
      headerDiv.innerHTML = `
        <span class="subject-name">${escapeHtml(subject)}</span>
        <div class="subject-actions">
          <button class="delete-subject-btn" data-subject="${escapeHtml(subject)}"><i class="fas fa-trash-alt"></i></button>
          <i class="fas fa-chevron-down subject-icon"></i>
        </div>
      `;
      const deleteBtn = headerDiv.querySelector('.delete-subject-btn');
      deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        pendingDeleteSubject = subject;
        document.getElementById('deleteModal').classList.add('open');
      });
      const topicsContainer = document.createElement('div');
      topicsContainer.className = 'topics-container';
      notesArray.forEach((note) => {
        const topicDiv = document.createElement('div');
        topicDiv.className = 'topic-item';
        const displayTopic = note.topic || 'Untitled Lesson';
        topicDiv.innerHTML = `
          <span class="topic-name">${escapeHtml(displayTopic)}</span>
          <div>
            <button class="edit-note-btn" data-id="${note.id}">Edit</button>
            <i class="fas fa-chevron-down topic-arrow"></i>
          </div>
        `;
        const notesContainer = document.createElement('div');
        notesContainer.className = 'notes-container';
        const contentHtml = note.content ? escapeHtml(note.content).replace(/\n/g, '<br>') : '<em>No content</em>';
        notesContainer.innerHTML = `<div class="notes-text">${contentHtml}</div>`;
        const arrowSpan = topicDiv.querySelector('.topic-arrow');
        topicDiv.addEventListener('click', (e) => {
          if (e.target.classList.contains('edit-note-btn')) return;
          const isOpen = notesContainer.classList.contains('open');
          if (isOpen) {
            notesContainer.classList.remove('open');
            arrowSpan.classList.remove('rotated');
          } else {
            notesContainer.classList.add('open');
            arrowSpan.classList.add('rotated');
          }
        });
        const editBtn = topicDiv.querySelector('.edit-note-btn');
        editBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openEditModal(note);
        });
        topicDiv.appendChild(notesContainer);
        topicsContainer.appendChild(topicDiv);
      });
      let isSubjectOpen = false;
      headerDiv.addEventListener('click', (e) => {
        if (e.target.classList.contains('delete-subject-btn')) return;
        const arrow = headerDiv.querySelector('.subject-icon');
        if (isSubjectOpen) {
          topicsContainer.classList.remove('open');
          arrow.classList.remove('rotated');
        } else {
          topicsContainer.classList.add('open');
          arrow.classList.add('rotated');
        }
        isSubjectOpen = !isSubjectOpen;
      });
      subjectDiv.appendChild(headerDiv);
      subjectDiv.appendChild(topicsContainer);
      container.appendChild(subjectDiv);
    });
  }

  function archiveSubject(subjectName) {
    const notesToArchive = appData.notes.filter(n => n.subject === subjectName);
    if (notesToArchive.length === 0) {
      showStatus(`No notes found for "${subjectName}".`);
      return;
    }
    appData.archived.unshift({
      id: Date.now(),
      subject: subjectName,
      notes: notesToArchive,
      archivedDate: new Date().toLocaleString()
    });
    appData.notes = appData.notes.filter(n => n.subject !== subjectName);
    localStorage.setItem(storageKey, JSON.stringify(appData));
    renderSubjects();
    showStatus(`"${subjectName}" moved to Archive.`);
  }

  function openEditModal(note) {
    currentEditNoteId = note.id;
    document.getElementById('editSubject').value = note.subject || '';
    document.getElementById('editTopic').value = note.topic || '';
    document.getElementById('editContent').value = note.content || '';
    document.getElementById('editModal').classList.add('open');
  }
  function closeEditModal() {
    document.getElementById('editModal').classList.remove('open');
    currentEditNoteId = null;
  }
  function saveEdit() {
    if (!currentEditNoteId) return;
    const noteIndex = appData.notes.findIndex(n => n.id === currentEditNoteId);
    if (noteIndex !== -1) {
      appData.notes[noteIndex].subject = document.getElementById('editSubject').value.trim() || 'Untitled';
      appData.notes[noteIndex].topic = document.getElementById('editTopic').value.trim() || 'Lesson';
      appData.notes[noteIndex].content = document.getElementById('editContent').value;
      appData.notes[noteIndex].date = new Date().toLocaleString();
      localStorage.setItem(storageKey, JSON.stringify(appData));
      renderSubjects();
      showStatus('Lesson updated!');
    }
    closeEditModal();
  }

  // Inline search
  const searchIconBtn = document.getElementById('searchIconBtn');
  const searchInputContainer = document.getElementById('searchInputContainer');
  const inlineSearchInput = document.getElementById('inlineSearchInput');
  const searchCloseBtn = document.getElementById('searchCloseBtn');
  function openInlineSearch() {
    searchIconBtn.style.display = 'none';
    searchInputContainer.style.display = 'flex';
    inlineSearchInput.focus();
    inlineSearchInput.value = currentSearchQuery;
  }
  function closeInlineSearch(resetQuery = true) {
    searchIconBtn.style.display = 'flex';
    searchInputContainer.style.display = 'none';
    if (resetQuery) {
      currentSearchQuery = "";
      inlineSearchInput.value = "";
      renderSubjects();
    }
  }
  searchIconBtn.addEventListener('click', openInlineSearch);
  searchCloseBtn.addEventListener('click', () => closeInlineSearch(true));
  inlineSearchInput.addEventListener('input', (e) => {
    currentSearchQuery = e.target.value;
    renderSubjects();
  });
  document.addEventListener('click', function(e) {
    const wrapper = document.querySelector('.search-wrapper');
    if (searchInputContainer.style.display === 'flex' && wrapper && !wrapper.contains(e.target)) {
      if (currentSearchQuery.trim() === "") closeInlineSearch(true);
    }
  });

  // Profile dropdown with avatar support
  const profilePic = document.getElementById('profilePic');
  const profileDropdown = document.getElementById('profileDropdown');
  const dropdownAvatar = document.getElementById('dropdownAvatar');
  function toggleDropdown(e) {
    e.stopPropagation();
    profileDropdown.classList.toggle('open');
  }
  profilePic.addEventListener('click', toggleDropdown);
  document.addEventListener('click', function(e) {
    if (!profilePic.contains(e.target) && !profileDropdown.contains(e.target)) {
      profileDropdown.classList.remove('open');
    }
  });
  // Set profile picture for header and dropdown
  setProfilePicture(profilePic, user);
  setProfilePicture(dropdownAvatar, user);
  document.getElementById('dropdownName').innerHTML = user.username || email.split('@')[0];
  document.getElementById('dropdownEmail').innerHTML = email;
  document.getElementById('dropdownUserInfo').onclick = () => window.location.href = 'profile.html';

  document.getElementById('deleteConfirmBtn').onclick = () => {
    if (pendingDeleteSubject) {
      archiveSubject(pendingDeleteSubject);
      pendingDeleteSubject = null;
    }
    document.getElementById('deleteModal').classList.remove('open');
  };
  document.getElementById('deleteCancelBtn').onclick = () => {
    pendingDeleteSubject = null;
    document.getElementById('deleteModal').classList.remove('open');
  };
  document.getElementById('saveEditBtn').onclick = saveEdit;
  document.getElementById('cancelEditBtn').onclick = closeEditModal;

  renderSubjects();
</script>
</body>
</html>
