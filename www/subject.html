<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Brainory - Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #eef2f5;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .phone {
    width: 390px; height: 844px;
    background: #f8fafc;
    display: flex;
    flex-direction: column;
    border-radius: 44px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    overflow: hidden;
    position: relative;
  }
  /* HEADER GRADIENT */
  .header-gradient {
    background: linear-gradient(160deg, #A8C8F0 0%, #B8D8C8 50%, #D4E8A0 100%);
    padding: 24px 20px 70px;
    position: relative;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .date-display {
    text-align: left;
    margin-top: 4px;
  }
  .day-name {
    font-size: 22px; font-weight: 800;
    color: #1a1a2e; font-style: italic;
    letter-spacing: 1px;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .full-date {
    font-size: 13px; color: #444; margin-top: 2px;
    font-family: 'Inter', sans-serif;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  .notif-btn {
    background: rgba(255,255,255,0.6);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center; justify-content: center;
    font-size: 16px;
    cursor: pointer;
    color: #1a1a2e;
  }
  .profile-pic {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B6B5B, #C49880);
    display: flex;
    align-items: center; justify-content: center;
    font-size: 16px;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    overflow: hidden;
    background-size: cover;
    background-position: center;
  }
  .profile-pic img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* Profile dropdown */
  .profile-dropdown {
    position: absolute;
    top: 50px;
    right: 0;
    width: 240px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    z-index: 150;
    display: none;
    overflow: hidden;
  }
  .profile-dropdown.open {
    display: block;
  }
  .dropdown-user {
    padding: 16px;
    text-align: center;
    border-bottom: 1px solid #e2e8f0;
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .dropdown-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B6B5B, #C49880);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: white;
    overflow: hidden;
  }
  .dropdown-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .dropdown-name {
    font-size: 16px;
    font-weight: 700;
    color: #0f172a;
  }
  .dropdown-email {
    font-size: 12px;
    color: #64748b;
    margin-top: 2px;
  }
  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    font-size: 14px;
    color: #1e293b;
    cursor: pointer;
    transition: background 0.2s;
    text-decoration: none;
  }
  .dropdown-item:hover {
    background: #f1f5f9;
  }
  .dropdown-item i {
    width: 20px;
    font-size: 16px;
    color: #3b82f6;
  }
  .dropdown-divider {
    height: 1px;
    background: #e2e8f0;
    margin: 4px 0;
  }
  .dropdown-logout {
    color: #dc2626;
  }
  .dropdown-logout i {
    color: #dc2626;
  }
  /* SCROLLABLE CONTENT */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 85px;
    margin-top: -50px;
    position: relative;
    z-index: 2;
  }
  .content::-webkit-scrollbar { display: none; }
  /* CARDS */
  .stats-card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 20px; padding: 16px 20px;
    margin-bottom: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .stats-row {
    display: flex; justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .stats-label { font-size: 14px; font-weight: 600; color: #555; }
  .stats-value { font-size: 18px; font-weight: 800; color: #0f172a; }
  .subjects-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    margin-top: 12px;
  }
  .subj-label { font-size: 13px; font-weight: 600; color: #64748b; }
  .subj-tag {
    background: #eef2ff; border-radius: 30px;
    padding: 6px 14px; font-size: 12px;
    color: #3b82f6; font-weight: 600;
  }
  .add-subject {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: 1px dashed #cbd5e1;
    border-radius: 30px; padding: 6px 14px;
    font-size: 12px; color: #64748b; cursor: pointer;
  }
  .graph-card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 20px; padding: 16px 20px;
    margin-bottom: 12px;
  }
  .graph-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 12px;
  }
  .section-title {
    font-size: 14px; font-weight: 800; color: #1a1a2e;
    letter-spacing: 0.5px; text-transform: uppercase;
  }
  .show-graph-btn {
    background: none; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; color: #3b82f6;
  }
  .chart-container { height: 120px; }
  .activity-card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 20px; padding: 16px 20px;
    margin-bottom: 12px;
  }
  .activity-title {
    font-size: 14px; font-weight: 800; color: #1a1a2e;
    text-transform: uppercase; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .activity-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid #f5f5f5;
  }
  .activity-item:last-child { border-bottom: none; }
  .activity-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #6B8CFF; flex-shrink: 0;
  }
  .activity-text { font-size: 13px; color: #1e293b; flex: 1; }
  .activity-time { font-size: 11px; color: #94a3b8; }
  .calendar-card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 20px; padding: 16px 20px;
    margin-bottom: 12px;
  }
  .calendar-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 12px;
  }
  .cal-month {
    font-weight: 700; color: #0f172a;
  }
  .cal-nav button {
    background: #f1f5f9; border: none;
    width: 32px; height: 32px; border-radius: 32px;
    cursor: pointer; font-size: 14px;
  }
  .calendar-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 6px; text-align: center; margin-bottom: 16px;
  }
  .cal-weekday {
    font-size: 11px; font-weight: 600; color: #94a3b8;
    padding: 6px 0;
  }
  .cal-day {
    font-size: 13px; font-weight: 500; padding: 8px 0;
    border-radius: 30px; cursor: pointer;
    color: #334155;
  }
  .cal-day.today {
    background: #3b82f6; color: white;
  }
  .cal-day.has-event {
    background: #fee2e2; color: #dc2626;
  }
  .upcoming-list {
    margin-top: 12px;
  }
  .upcoming-item {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 0; border-top: 1px solid #f1f5f9;
  }
  .upcoming-time { font-size: 12px; font-weight: 600; color: #3b82f6; width: 60px; }
  .upcoming-text { font-size: 13px; color: #1e293b; flex: 1; }
  /* BOTTOM NAV – FIXED */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-width: 390px;
    margin: 0 auto;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(0,0,0,0.05);
    border-radius: 0 0 44px 44px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 8px 12px 20px;
    z-index: 20;
  }
  .nav-btn {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border-radius: 40px;
    color: #94a3b8;
    font-size: 22px;
    transition: all 0.2s;
    text-decoration: none;
  }
  .nav-btn.active { color: #3b82f6; }
  .nav-btn span { font-size: 10px; font-weight: 600; }
  .nav-center-btn {
    width: 52px;
    height: 52px;
    border-radius: 52px;
    background: #3b82f6;
    border: none;
    display: flex;
    align-items: center; justify-content: center;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 6px 12px rgba(59,130,246,0.3);
    color: white;
    text-decoration: none;
    transition: transform 0.2s;
  }
  .nav-center-btn:active { transform: scale(0.95); }
</style>
</head>
<body>
<div class="phone">
  <div class="header-gradient">
    <div class="top-bar">
      <div class="date-display">
        <div class="day-name" id="dayName"></div>
        <div class="full-date" id="fullDate"></div>
      </div>
      <div class="header-right">
        <button class="notif-btn" onclick="window.location.href='notification.html'"><i class="fas fa-bell"></i></button>
        <div class="profile-pic" id="profilePic" onclick="toggleDropdown()"></div>
        <div class="profile-dropdown" id="profileDropdown">
          <div class="dropdown-user" id="dropdownUserInfo">
            <div class="dropdown-avatar" id="dropdownAvatar"></div>
            <div class="dropdown-name" id="dropdownName">User</div>
            <div class="dropdown-email" id="dropdownEmail">user@example.com</div>
          </div>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" href="quiz.html"><i class="fas fa-brain"></i> Quiz</a>
          <a class="dropdown-item" href="archive.html"><i class="fas fa-archive"></i> Archive</a>
          <a class="dropdown-item" href="settings.html"><i class="fas fa-cog"></i> Settings</a>
          <a class="dropdown-item" href="about.html"><i class="fas fa-info-circle"></i> About</a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item dropdown-logout" href="logout.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="stats-card">
      <div class="stats-row">
        <span class="stats-label">Today's Study</span>
        <span class="stats-value" id="todayTime">0h 0m</span>
      </div>
      <div class="subjects-row">
        <span class="subj-label">Subjects</span>
        <div id="subjectTags"></div>
        <div class="add-subject" id="addSubjectBtn"><i class="fas fa-plus"></i> Add</div>
      </div>
    </div>

    <div class="graph-card">
      <div class="graph-header">
        <span class="section-title"><i class="fas fa-chart-simple"></i> Study Trend</span>
        <button class="show-graph-btn" id="toggleGraphBtn">Hide Graph</button>
      </div>
      <div class="chart-container" id="chartContainer">
        <canvas id="studyChart"></canvas>
      </div>
    </div>

    <div class="calendar-card">
      <div class="calendar-header">
        <span class="cal-month" id="calMonthYear"></span>
        <div class="cal-nav">
          <button id="prevMonthBtn"><i class="fas fa-chevron-left"></i></button>
          <button id="nextMonthBtn"><i class="fas fa-chevron-right"></i></button>
        </div>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="upcoming-list" id="upcomingList">
        <div class="upcoming-item"><span class="upcoming-time">—</span><span class="upcoming-text">No upcoming schedules</span></div>
      </div>
    </div>

    <div class="activity-card">
      <div class="activity-title"><i class="fas fa-history"></i> Recent Activity</div>
      <div id="activityList"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <a class="nav-btn active" href="dashboard.html"><i class="fas fa-home"></i><span>Home</span></a>
    <a class="nav-btn" href="subject.html"><i class="fas fa-book"></i><span>Lessons</span></a>
    <a class="nav-center-btn" href="notes.html"><i class="fas fa-plus"></i></a>
    <a class="nav-btn" href="progress.html"><i class="fas fa-chart-line"></i><span>Graphs</span></a>
    <a class="nav-btn" href="schedule.html"><i class="fas fa-calendar-alt"></i><span>Calendar</span></a>
  </div>
</div>

<script>
  // ---------- AUTH & DATA ----------
  const email = localStorage.getItem('brainory_currentUser');
  if (!email) window.location.href = 'login.html';
  const users = JSON.parse(localStorage.getItem('brainory_users') || '{}');
  const user = users[email] || { username: email.split('@')[0], email };
  const storageKey = 'brainory_' + email;
  let appData = JSON.parse(localStorage.getItem(storageKey) || '{}');
  if (!appData.notes) appData.notes = [];
  if (!appData.activities) appData.activities = [];
  if (!appData.schedules) appData.schedules = [];

  // Helper: set profile picture (avatar or initials)
  function setProfilePicture(element, user, size = '40px') {
    if (!element) return;
    if (user.avatar) {
      element.innerHTML = `<img src="${user.avatar}" alt="avatar">`;
      element.style.background = 'none';
    } else {
      const initial = (user.username || user.email).charAt(0).toUpperCase();
      element.innerHTML = initial;
      element.style.background = 'linear-gradient(135deg, #8B6B5B, #C49880)';
    }
  }

  // ---------- Helper: get unique subjects from notes ----------
  function getSubjectsFromNotes() {
    const subjectsSet = new Set();
    appData.notes.forEach(note => {
      if (note.subject && note.subject.trim()) subjectsSet.add(note.subject.trim());
    });
    return Array.from(subjectsSet).sort();
  }

  // ---------- Dashboard UI ----------
  function updateDashboard() {
    const subjects = getSubjectsFromNotes();
    const tagsContainer = document.getElementById('subjectTags');
    tagsContainer.innerHTML = '';
    if (subjects.length === 0) {
      tagsContainer.innerHTML = '<span class="subj-tag" style="background:#f1f5f9; color:#94a3b8;">No subjects yet → Add a note</span>';
    } else {
      subjects.forEach(s => {
        const tag = document.createElement('span');
        tag.className = 'subj-tag';
        tag.textContent = s;
        tagsContainer.appendChild(tag);
      });
    }

    let totalMins = 0;
    const todayStr = new Date().toISOString().slice(0,10);
    appData.activities.forEach(a => {
      if (a.date === todayStr) {
        const match = a.duration.match(/(\d+)h\s*(\d+)m/) || a.duration.match(/(\d+)h/);
        if (match) {
          if (match[2]) totalMins += parseInt(match[1])*60 + parseInt(match[2]);
          else totalMins += parseInt(match[1])*60;
        }
      }
    });
    const h = Math.floor(totalMins/60), m = totalMins % 60;
    document.getElementById('todayTime').innerHTML = `${h}h ${m}m`;

    const actContainer = document.getElementById('activityList');
    actContainer.innerHTML = '';
    appData.activities.slice(0,5).forEach(a => {
      const div = document.createElement('div');
      div.className = 'activity-item';
      div.innerHTML = `<div class="activity-dot"></div><div class="activity-text">${a.subject} (${a.duration})</div><div class="activity-time">${a.time}</div>`;
      actContainer.appendChild(div);
    });
  }

  // ---------- Mini Calendar ----------
  let currentCalDate = new Date();
  function renderMiniCalendar() {
    const year = currentCalDate.getFullYear();
    const month = currentCalDate.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const today = new Date();
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('calMonthYear').innerHTML = `${monthNames[month]} ${year}`;

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    const weekdays = ['S','M','T','W','T','F','S'];
    weekdays.forEach(d => {
      const div = document.createElement('div');
      div.className = 'cal-weekday';
      div.textContent = d;
      grid.appendChild(div);
    });
    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'cal-day';
      empty.innerHTML = '';
      grid.appendChild(empty);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dayDiv = document.createElement('div');
      dayDiv.className = 'cal-day';
      dayDiv.textContent = d;
      const isToday = (d === today.getDate() && month === today.getMonth() && year === today.getFullYear());
      if (isToday) dayDiv.classList.add('today');
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const hasEvent = appData.schedules && appData.schedules.some(s => s.date === dateStr);
      if (hasEvent) dayDiv.classList.add('has-event');
      dayDiv.onclick = () => alert(`Selected ${dateStr}\nYou can add schedule on Calendar page.`);
      grid.appendChild(dayDiv);
    }

    const upcomingDiv = document.getElementById('upcomingList');
    upcomingDiv.innerHTML = '';
    const todayStr = new Date().toISOString().slice(0,10);
    const upcoming = (appData.schedules || []).filter(s => s.date >= todayStr).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
    if (upcoming.length === 0) {
      upcomingDiv.innerHTML = '<div class="upcoming-item"><span class="upcoming-time">—</span><span class="upcoming-text">No upcoming schedules</span></div>';
    } else {
      upcoming.forEach(s => {
        const item = document.createElement('div');
        item.className = 'upcoming-item';
        item.innerHTML = `<span class="upcoming-time">${s.date.slice(5)}</span><span class="upcoming-text">${s.title || s.text}</span>`;
        upcomingDiv.appendChild(item);
      });
    }
  }

  // ---------- Chart ----------
  let chart;
  const ctx = document.getElementById('studyChart').getContext('2d');
  function initChart() {
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
        datasets: [{
          data: [2.5, 4, 3, 5, 3.5, 4.5, 3],
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59,130,246,0.1)',
          borderWidth: 2.5,
          fill: true,
          tension: 0.4,
          pointRadius: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: { legend: { display: false }, tooltip: { enabled: true } },
        scales: { x: { grid: { display: false }, ticks: { font: { size: 10 } } }, y: { display: false } }
      }
    });
  }
  let chartVisible = true;
  document.getElementById('toggleGraphBtn').onclick = () => {
    const container = document.getElementById('chartContainer');
    const btn = document.getElementById('toggleGraphBtn');
    if (chartVisible) {
      container.style.display = 'none';
      btn.innerHTML = 'Show Graph';
    } else {
      container.style.display = 'block';
      btn.innerHTML = 'Hide Graph';
      setTimeout(() => chart.resize(), 50);
    }
    chartVisible = !chartVisible;
  };

  // Add subject button -> notes page
  document.getElementById('addSubjectBtn').onclick = () => {
    window.location.href = 'notes.html';
  };

  // ---------- User info, avatar & date ----------
  setProfilePicture(document.getElementById('profilePic'), user);
  setProfilePicture(document.getElementById('dropdownAvatar'), user);
  document.getElementById('dropdownName').innerHTML = user.username || email.split('@')[0];
  document.getElementById('dropdownEmail').innerHTML = email;

  // Dropdown user info click -> profile page
  document.getElementById('dropdownUserInfo').onclick = () => {
    window.location.href = 'profile.html';
  };

  const now = new Date();
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('dayName').innerHTML = days[now.getDay()];
  document.getElementById('fullDate').innerHTML = `${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;

  // Calendar navigation
  document.getElementById('prevMonthBtn').onclick = () => { currentCalDate.setMonth(currentCalDate.getMonth()-1); renderMiniCalendar(); };
  document.getElementById('nextMonthBtn').onclick = () => { currentCalDate.setMonth(currentCalDate.getMonth()+1); renderMiniCalendar(); };

  // Initialize
  updateDashboard();
  initChart();
  renderMiniCalendar();

  // ---------- Profile dropdown toggle ----------
  function toggleDropdown() {
    const dropdown = document.getElementById('profileDropdown');
    dropdown.classList.toggle('open');
  }
  document.addEventListener('click', function(event) {
    const dropdown = document.getElementById('profileDropdown');
    const profilePic = document.getElementById('profilePic');
    if (!profilePic.contains(event.target) && !dropdown.contains(event.target)) {
      dropdown.classList.remove('open');
    }
  });
</script>
</body>
</html>
