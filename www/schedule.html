<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Brainory - Schedule</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #eef2f5;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .phone {
    width: 390px; height: 844px;
    background: #f8fafc;
    display: flex;
    flex-direction: column;
    border-radius: 44px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    overflow: hidden;
    position: relative;
  }
  /* HEADER */
  .header-gradient {
    background: linear-gradient(160deg, #A8C8F0 0%, #B8D8C8 50%, #D4E8A0 100%);
    padding: 24px 20px 35px;
    position: relative;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .page-title {
    font-size: 22px;
    font-weight: 800;
    color: #1a1a2e;
    font-style: italic;
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  .notif-btn {
    background: rgba(255,255,255,0.6);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    color: #1a1a2e;
  }
  .profile-pic {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B6B5B, #C49880);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    overflow: hidden;
    background-size: cover;
    background-position: center;
  }
  .profile-pic img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* Search row */
  .search-row {
    margin-top: 8px;
  }
  .search-wrapper {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.5);
    border-radius: 40px;
    padding: 4px;
    backdrop-filter: blur(4px);
    width: fit-content;
  }
  .search-icon-btn {
    background: white;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    color: #3b82f6;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .search-input-container {
    display: flex;
    align-items: center;
    background: white;
    border-radius: 40px;
    overflow: hidden;
  }
  .search-input-container input {
    border: none;
    padding: 8px 12px;
    font-size: 14px;
    width: 180px;
    outline: none;
  }
  .search-close-btn {
    background: none;
    border: none;
    padding: 0 12px;
    cursor: pointer;
    color: #94a3b8;
  }
  /* Profile dropdown */
  .profile-dropdown {
    position: absolute;
    top: 50px;
    right: 0;
    width: 240px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    z-index: 1000;
    display: none;
    overflow: hidden;
  }
  .profile-dropdown.open { display: block; }
  .dropdown-user {
    padding: 16px;
    text-align: center;
    border-bottom: 1px solid #e2e8f0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .dropdown-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B6B5B, #C49880);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: white;
    overflow: hidden;
  }
  .dropdown-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .dropdown-name {
    font-size: 16px;
    font-weight: 700;
    color: #0f172a;
  }
  .dropdown-email {
    font-size: 12px;
    color: #64748b;
    margin-top: 2px;
  }
  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    font-size: 14px;
    color: #1e293b;
    cursor: pointer;
    text-decoration: none;
  }
  .dropdown-item:hover { background: #f1f5f9; }
  .dropdown-item i { width: 20px; color: #3b82f6; }
  .dropdown-divider { height: 1px; background: #e2e8f0; margin: 4px 0; }
  .dropdown-logout { color: #dc2626; }
  .dropdown-logout i { color: #dc2626; }
  /* Modals */
  .modal {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 300;
    display: none; align-items: center; justify-content: center;
  }
  .modal.open { display: flex; }
  .modal-content {
    background: white; width: 320px;
    border-radius: 32px;
    padding: 24px;
    text-align: center;
  }
  .modal-content h3 { margin-bottom: 16px; color: #0f172a; }
  .modal-content input {
    width: 100%;
    padding: 12px;
    border-radius: 40px;
    border: 1px solid #e2e8f0;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .ampm-buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }
  .ampm-btn {
    flex: 1;
    padding: 10px;
    border-radius: 40px;
    border: 1px solid #e2e8f0;
    background: #f8fafc;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }
  .ampm-btn.active {
    background: #3b82f6;
    color: white;
    border-color: #3b82f6;
  }
  .modal-buttons {
    display: flex;
    gap: 12px;
  }
  .modal-buttons button {
    flex: 1;
    padding: 10px;
    border-radius: 40px;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }
  .modal-save { background: #3b82f6; color: white; }
  .modal-cancel { background: #f1f5f9; color: #334155; }
  /* MAIN CONTENT */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 85px;
    margin-top: -30px;
    position: relative;
    z-index: 2;
  }
  .content::-webkit-scrollbar { display: none; }
  /* CALENDAR CARD */
  .calendar-card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 28px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .cal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .cal-nav-btn {
    background: #f1f5f9; border: none;
    width: 36px; height: 36px; border-radius: 36px;
    font-size: 18px; cursor: pointer; color: #1e293b;
  }
  .cal-month-year {
    font-size: 16px; font-weight: 700; color: #0f172a;
  }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 4px; text-align: center;
  }
  .cal-day-name {
    font-size: 12px; font-weight: 600; color: #64748b;
    padding: 8px 0;
  }
  .cal-day {
    font-size: 14px; font-weight: 500; padding: 8px 0;
    border-radius: 40px; cursor: pointer;
    color: #334155; transition: 0.2s;
    margin: 2px;
    position: relative;
  }
  .cal-day:hover { background: #eef2ff; }
  .cal-day.today {
    background: #3b82f6; color: white;
    font-weight: 600;
  }
  .cal-day.selected {
    background: #F5E642; color: #1a1a2e;
    font-weight: 700;
  }
  .cal-day.has-schedule::after {
    content: "•";
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #ef4444;
  }
  .cal-day.other-month { color: #cbd5e1; }
  /* Schedule list */
  .schedules-container {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 28px;
    padding: 16px 20px;
  }
  .schedule-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid #f1f5f9;
  }
  .schedule-item:last-child { border-bottom: none; }
  .schedule-info { flex: 1; }
  .schedule-time {
    font-size: 14px;
    font-weight: 600;
    color: #3b82f6;
  }
  .schedule-text {
    font-size: 14px;
    color: #1e293b;
    margin-top: 2px;
  }
  .delete-schedule {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: #94a3b8;
    padding: 8px;
  }
  .delete-schedule:hover { color: #ef4444; }
  .empty-schedule {
    text-align: center;
    padding: 30px;
    color: #94a3b8;
    font-size: 14px;
  }
  .add-schedule-btn {
    background: #3b82f6;
    color: white;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 44px;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(59,130,246,0.3);
  }
  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-width: 390px;
    margin: 0 auto;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(0,0,0,0.05);
    border-radius: 0 0 44px 44px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 8px 12px 20px;
    z-index: 20;
  }
  .nav-btn {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border-radius: 40px;
    color: #94a3b8;
    font-size: 22px;
    text-decoration: none;
  }
  .nav-btn.active { color: #3b82f6; }
  .nav-btn span { font-size: 10px; font-weight: 600; }
  .nav-center-btn {
    width: 52px;
    height: 52px;
    border-radius: 52px;
    background: #3b82f6;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 6px 12px rgba(59,130,246,0.3);
    color: white;
    text-decoration: none;
  }
  .nav-center-btn:active { transform: scale(0.95); }
</style>
</head>
<body>
<div class="phone">
  <div class="header-gradient">
    <div class="top-bar">
      <div class="page-title">Calendar Schedule</div>
      <div class="header-right">
        <button class="notif-btn" onclick="window.location.href='notification.html'"><i class="fas fa-bell"></i></button>
        <div class="profile-pic" id="profilePic" onclick="toggleDropdown()"></div>
        <div class="profile-dropdown" id="profileDropdown">
          <div class="dropdown-user" id="dropdownUserInfo">
            <div class="dropdown-avatar" id="dropdownAvatar"></div>
            <div class="dropdown-name" id="dropdownName">User</div>
            <div class="dropdown-email" id="dropdownEmail">user@example.com</div>
          </div>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" href="quiz.html"><i class="fas fa-brain"></i> Quiz</a>
          <a class="dropdown-item" href="archive.html"><i class="fas fa-archive"></i> Archive</a>
          <a class="dropdown-item" href="settings.html"><i class="fas fa-cog"></i> Settings</a>
          <a class="dropdown-item" href="about.html"><i class="fas fa-info-circle"></i> About</a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item dropdown-logout" href="logout.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
      </div>
    </div>
    <div class="search-row">
      <div class="search-wrapper">
        <button class="search-icon-btn" id="searchIconBtn"><i class="fas fa-search"></i></button>
        <div class="search-input-container" id="searchInputContainer" style="display: none;">
          <input type="text" id="inlineSearchInput" placeholder="Search schedules...">
          <button class="search-close-btn" id="searchCloseBtn"><i class="fas fa-times"></i></button>
        </div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="calendar-card">
      <div class="cal-header">
        <button class="cal-nav-btn" id="prevMonthBtn"><i class="fas fa-chevron-left"></i></button>
        <div class="cal-month-year" id="calMonthYear"></div>
        <button class="cal-nav-btn" id="nextMonthBtn"><i class="fas fa-chevron-right"></i></button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="schedules-container">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <div style="font-size: 14px; font-weight: 800; text-transform: uppercase;">Schedules for <span id="selectedDateDisplay"></span></div>
        <button class="add-schedule-btn" id="addScheduleBtn"><i class="fas fa-plus"></i></button>
      </div>
      <div id="schedulesList"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <a class="nav-btn" href="dashboard.html"><i class="fas fa-home"></i><span>Home</span></a>
    <a class="nav-btn" href="subject.html"><i class="fas fa-book"></i><span>Lessons</span></a>
    <a class="nav-center-btn" href="notes.html"><i class="fas fa-plus"></i></a>
    <a class="nav-btn" href="progress.html"><i class="fas fa-chart-line"></i><span>Graphs</span></a>
    <a class="nav-btn active" href="schedule.html"><i class="fas fa-calendar-alt"></i><span>Calendar</span></a>
  </div>

  <!-- Modal for adding schedule with manual time + AM/PM -->
  <div class="modal" id="scheduleModal">
    <div class="modal-content">
      <h3>Add Schedule</h3>
      <input type="text" id="scheduleText" placeholder="What do you need to do?" autocomplete="off">
      <input type="text" id="scheduleTimeInput" placeholder="Time (e.g., 9:30)" autocomplete="off" value="9:00">
      <div class="ampm-buttons">
        <button type="button" class="ampm-btn" id="amBtn">AM</button>
        <button type="button" class="ampm-btn" id="pmBtn">PM</button>
      </div>
      <div class="modal-buttons">
        <button class="modal-save" id="modalSaveBtn">Save</button>
        <button class="modal-cancel" id="modalCancelBtn">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ---------- AUTH & DATA ----------
  const email = localStorage.getItem('brainory_currentUser');
  if (!email) window.location.href = 'login.html';
  const users = JSON.parse(localStorage.getItem('brainory_users') || '{}');
  const user = users[email] || { username: email.split('@')[0], email };
  const storageKey = 'brainory_' + email;
  let appData = JSON.parse(localStorage.getItem(storageKey) || '{}');
  if (!appData.schedules) appData.schedules = [];

  // Helper: set profile picture (avatar or initials)
  function setProfilePicture(element, user) {
    if (!element) return;
    if (user.avatar) {
      element.innerHTML = `<img src="${user.avatar}" alt="avatar">`;
      element.style.background = 'none';
    } else {
      const initial = (user.username || user.email).charAt(0).toUpperCase();
      element.innerHTML = initial;
      element.style.background = 'linear-gradient(135deg, #8B6B5B, #C49880)';
    }
  }

  // ---------- Helper: Convert 24‑hour time to 12‑hour with AM/PM ----------
  function formatDisplayTime(time24) {
    if (!time24) return '';
    let [hour, minute] = time24.split(':');
    hour = parseInt(hour, 10);
    minute = minute || '00';
    const ampm = hour >= 12 ? 'PM' : 'AM';
    let hour12 = hour % 12;
    if (hour12 === 0) hour12 = 12;
    return `${hour12}:${minute} ${ampm}`;
  }

  // ---------- Calendar logic ----------
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  let viewYear = new Date().getFullYear();
  let viewMonth = new Date().getMonth();
  let selectedDate = new Date().toISOString().slice(0,10);
  let currentSearchQuery = "";

  function formatDate(year, month, day) {
    return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }

  function getSchedulesForDate(dateStr) {
    return appData.schedules.filter(s => s.date === dateStr).sort((a,b) => a.time.localeCompare(b.time));
  }

  function renderSchedules() {
    const container = document.getElementById('schedulesList');
    const dateDisplay = document.getElementById('selectedDateDisplay');
    dateDisplay.textContent = selectedDate;
    const schedules = getSchedulesForDate(selectedDate);
    const filtered = currentSearchQuery.trim() ? schedules.filter(s => s.text.toLowerCase().includes(currentSearchQuery.toLowerCase())) : schedules;
    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty-schedule"><i class="fas fa-calendar-day"></i> No schedules for this day. Tap + to add.</div>`;
      return;
    }
    container.innerHTML = filtered.map(s => `
      <div class="schedule-item" data-id="${s.id}">
        <div class="schedule-info">
          <div class="schedule-time">⏰ ${formatDisplayTime(s.time)}</div>
          <div class="schedule-text">${escapeHtml(s.text)}</div>
        </div>
        <button class="delete-schedule" data-id="${s.id}"><i class="fas fa-trash-alt"></i></button>
      </div>
    `).join('');
    document.querySelectorAll('.delete-schedule').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteSchedule(parseInt(btn.getAttribute('data-id')));
      });
    });
  }

  function deleteSchedule(id) {
    appData.schedules = appData.schedules.filter(s => s.id !== id);
    localStorage.setItem(storageKey, JSON.stringify(appData));
    renderSchedules();
    renderCalendar();
  }

  // Convert 12‑hour time + AM/PM to 24‑hour string (HH:MM)
  function convertTo24Hour(timeStr, isAM) {
    let [hour, minute] = timeStr.split(':');
    hour = parseInt(hour, 10);
    minute = minute ? parseInt(minute, 10) : 0;
    if (isNaN(hour)) hour = 12;
    if (isNaN(minute)) minute = 0;
    if (!isAM && hour !== 12) hour += 12;
    if (isAM && hour === 12) hour = 0;
    return `${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`;
  }

  function saveSchedule(text, time12, isAM, date) {
    if (!text.trim()) return;
    const time24 = convertTo24Hour(time12, isAM);
    appData.schedules.push({
      id: Date.now(),
      date: date,
      time: time24,
      text: text.trim()
    });
    localStorage.setItem(storageKey, JSON.stringify(appData));
    renderSchedules();
    renderCalendar();
  }

  // Calendar rendering with schedule dots
  function renderCalendar() {
    document.getElementById('calMonthYear').textContent = `${months[viewMonth]} ${viewYear}`;
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    const dayNames = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    dayNames.forEach(d => {
      const div = document.createElement('div');
      div.className = 'cal-day-name';
      div.textContent = d;
      grid.appendChild(div);
    });
    let firstDayIndex = new Date(viewYear, viewMonth, 1).getDay();
    let offset = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const prevMonthDays = new Date(viewYear, viewMonth, 0).getDate();
    const today = new Date();

    for (let i = offset - 1; i >= 0; i--) {
      const dayNum = prevMonthDays - i;
      const dateStr = formatDate(viewYear, viewMonth-1, dayNum);
      const hasSchedule = appData.schedules.some(s => s.date === dateStr);
      const div = document.createElement('div');
      div.className = `cal-day other-month ${hasSchedule ? 'has-schedule' : ''}`;
      div.textContent = dayNum;
      div.onclick = () => {
        viewMonth--; if (viewMonth<0) { viewMonth=11; viewYear--; }
        selectedDate = formatDate(viewYear, viewMonth, dayNum);
        renderCalendar();
        renderSchedules();
      };
      grid.appendChild(div);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = formatDate(viewYear, viewMonth, d);
      const hasSchedule = appData.schedules.some(s => s.date === dateStr);
      let className = 'cal-day';
      if (d === today.getDate() && viewMonth === today.getMonth() && viewYear === today.getFullYear()) className += ' today';
      if (dateStr === selectedDate) className += ' selected';
      if (hasSchedule) className += ' has-schedule';
      const div = document.createElement('div');
      div.className = className;
      div.textContent = d;
      div.onclick = () => { selectedDate = dateStr; renderCalendar(); renderSchedules(); };
      grid.appendChild(div);
    }
    const totalCells = 42;
    const currentCells = offset + daysInMonth;
    const remaining = totalCells - currentCells;
    for (let d = 1; d <= remaining; d++) {
      const dateStr = formatDate(viewYear, viewMonth+1, d);
      const hasSchedule = appData.schedules.some(s => s.date === dateStr);
      const div = document.createElement('div');
      div.className = `cal-day other-month ${hasSchedule ? 'has-schedule' : ''}`;
      div.textContent = d;
      div.onclick = () => {
        viewMonth++; if (viewMonth>11) { viewMonth=0; viewYear++; }
        selectedDate = formatDate(viewYear, viewMonth, d);
        renderCalendar();
        renderSchedules();
      };
      grid.appendChild(div);
    }
  }

  function prevMonth() { viewMonth--; if (viewMonth<0) { viewMonth=11; viewYear--; } renderCalendar(); }
  function nextMonth() { viewMonth++; if (viewMonth>11) { viewMonth=0; viewYear++; } renderCalendar(); }

  // ---------- Modal with manual time + AM/PM ----------
  const modal = document.getElementById('scheduleModal');
  const addBtn = document.getElementById('addScheduleBtn');
  const modalSave = document.getElementById('modalSaveBtn');
  const modalCancel = document.getElementById('modalCancelBtn');
  const scheduleText = document.getElementById('scheduleText');
  const scheduleTimeInput = document.getElementById('scheduleTimeInput');
  const amBtn = document.getElementById('amBtn');
  const pmBtn = document.getElementById('pmBtn');
  let currentAmPm = 'AM'; // default

  function updateAmPmUI() {
    if (currentAmPm === 'AM') {
      amBtn.classList.add('active');
      pmBtn.classList.remove('active');
    } else {
      pmBtn.classList.add('active');
      amBtn.classList.remove('active');
    }
  }

  function openModal() {
    scheduleText.value = '';
    scheduleTimeInput.value = '9:00';
    currentAmPm = 'AM';
    updateAmPmUI();
    modal.classList.add('open');
  }
  function closeModal() { modal.classList.remove('open'); }
  addBtn.onclick = openModal;
  modalCancel.onclick = closeModal;
  amBtn.onclick = () => { currentAmPm = 'AM'; updateAmPmUI(); };
  pmBtn.onclick = () => { currentAmPm = 'PM'; updateAmPmUI(); };

  modalSave.onclick = () => {
    const text = scheduleText.value.trim();
    let timeStr = scheduleTimeInput.value.trim();
    if (!text) { alert("Please enter a schedule."); return; }
    const timeRegex = /^([0-9]|0[0-9]|1[0-2]):([0-5][0-9])$/;
    if (!timeRegex.test(timeStr)) {
      alert("Please enter a valid time in 12‑hour format, e.g., 9:30 or 11:45");
      return;
    }
    saveSchedule(text, timeStr, currentAmPm === 'AM', selectedDate);
    closeModal();
  };
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

  // ---------- Inline Search ----------
  const searchIconBtn = document.getElementById('searchIconBtn');
  const searchInputContainer = document.getElementById('searchInputContainer');
  const inlineSearchInput = document.getElementById('inlineSearchInput');
  const searchCloseBtn = document.getElementById('searchCloseBtn');
  function openInlineSearch() {
    searchIconBtn.style.display = 'none';
    searchInputContainer.style.display = 'flex';
    inlineSearchInput.focus();
    inlineSearchInput.value = currentSearchQuery;
  }
  function closeInlineSearch(resetQuery = true) {
    searchIconBtn.style.display = 'flex';
    searchInputContainer.style.display = 'none';
    if (resetQuery) { currentSearchQuery = ""; inlineSearchInput.value = ""; renderSchedules(); }
  }
  searchIconBtn.addEventListener('click', openInlineSearch);
  searchCloseBtn.addEventListener('click', () => closeInlineSearch(true));
  inlineSearchInput.addEventListener('input', (e) => { currentSearchQuery = e.target.value; renderSchedules(); });
  document.addEventListener('click', function(e) {
    const wrapper = document.querySelector('.search-wrapper');
    if (searchInputContainer.style.display === 'flex' && wrapper && !wrapper.contains(e.target)) {
      if (currentSearchQuery.trim() === "") closeInlineSearch(true);
    }
  });

  // ---------- Profile Dropdown with avatar ----------
  const profilePic = document.getElementById('profilePic');
  const profileDropdown = document.getElementById('profileDropdown');
  const dropdownAvatar = document.getElementById('dropdownAvatar');
  function toggleDropdown(e) { e.stopPropagation(); profileDropdown.classList.toggle('open'); }
  profilePic.addEventListener('click', toggleDropdown);
  document.addEventListener('click', function(e) {
    if (!profilePic.contains(e.target) && !profileDropdown.contains(e.target)) profileDropdown.classList.remove('open');
  });
  setProfilePicture(profilePic, user);
  setProfilePicture(dropdownAvatar, user);
  document.getElementById('dropdownName').innerHTML = user.username || email.split('@')[0];
  document.getElementById('dropdownEmail').innerHTML = email;
  document.getElementById('dropdownUserInfo').onclick = () => window.location.href = 'profile.html';

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
  }

  document.getElementById('prevMonthBtn').onclick = prevMonth;
  document.getElementById('nextMonthBtn').onclick = nextMonth;

  renderCalendar();
  renderSchedules();
</script>
</body>
</html>
